<style>
:root{
  --bg:#EEF3FA;--surface:#FFFFFF;--surface-2:#E3EAF4;--line:#CBD6E5;--fg:#0E1A33;--muted:#56627A;
  --blue:#1677D2;--blue-deep:#0B2F6B;--navy:#081446;--ink:#FFFFFF;
  --yellow:#F0B400;--red:#D23A2E;--ok:#1E8A4F;--warn:#A85B05;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#060D24;--surface:#0E1838;--surface-2:#16224A;--line:#25325C;--fg:#E8EEFA;--muted:#9AA7C4;
  --blue:#3B8FE6;--ok:#46C07F;--warn:#E8A33C;--red:#F0604F;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.note{font-size:13px;color:var(--muted);margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}

/* testata */
.band{background:linear-gradient(90deg,rgba(5,12,40,.5) 0%,rgba(5,12,40,.4) 60%,rgba(5,12,40,.3) 100%),url(../sfondo-barra.jpg?v=2) 92% 42%/max(165%,640px) auto no-repeat,#0B1640;color:var(--ink);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 24px 24px;margin-bottom:16px}
.band-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px}
.band img{width:52px;height:52px;border-radius:14px;background:#fff;padding:4px;object-fit:contain;flex:none}
.band h1{font-size:30px;font-weight:800;text-transform:uppercase;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.band .sub{opacity:.85;font-size:14px}
.band .out{margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}

/* elementi */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;min-height:46px;text-decoration:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--fg)}
.btn-ok{background:var(--ok);color:#fff}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:22px;margin-bottom:6px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--surface-2);font-size:12px;font-weight:700;text-align:center;margin-left:4px;color:var(--fg)}
.cnt.hot{background:var(--red);color:#fff}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:left;cursor:pointer}
.item .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:15px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-attesa{background:rgba(232,163,60,.18);color:var(--warn)}
.b-approvato{background:rgba(30,138,79,.16);color:var(--ok)}
.b-rifiutato,.b-sospeso,.b-revocato{background:rgba(210,58,46,.14);color:var(--red)}
.b-scaduto{background:var(--surface-2);color:var(--muted)}
.empty{text-align:center;padding:26px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty h3{color:var(--fg);font-size:22px;margin-bottom:4px}
.status{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--red);font-weight:600}
.warn-box{background:rgba(232,163,60,.14);border:1px solid rgba(232,163,60,.45);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:14px}

/* moduli */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;grid-column:1/-1}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
.foto-pick{display:flex;align-items:center;gap:14px;grid-column:1/-1}
.foto-pick img,.foto-pick .ph{width:84px;height:104px;border-radius:12px;object-fit:cover;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;flex:none}
.actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}

/* foglio in basso */
.sheet-bg{position:fixed;inset:0;background:rgba(3,8,25,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s ease}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:su .28s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-size:26px;grid-column:1/-1}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0E1A33;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* pagina di accesso */
#gate{min-height:100vh;min-height:100dvh;background:var(--sfondo);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));color:#fff}
#gate .in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;animation:su .5s cubic-bezier(.2,.8,.2,1)}
#gate .logo{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:92px;height:92px;border-radius:22px;background:#fff;padding:8px;object-fit:contain;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#gate h1{font-size:26px;text-transform:uppercase;text-align:center;line-height:1}
#gate{position:relative}
#gate .glass{background:rgba(6,12,40,.7);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:12px}
#gate .glass .note{color:rgba(255,255,255,.75)}
#gate .field label{color:rgba(255,255,255,.7)}
#gate .field input,#gate .field select{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.22);color:#fff}
#gate .field select option{color:#000}
#gate .seg{background:rgba(255,255,255,.1);padding:4px;margin:0;border-radius:14px;overflow:visible}
#gate .seg button{color:rgba(255,255,255,.7)}
#gate .seg button{background:transparent;border-color:rgba(255,255,255,.28);color:rgba(255,255,255,.8)}
#gate .seg button[aria-pressed=true]{background:rgba(255,255,255,.95);color:#081446;border-color:#fff}
#gate .link{background:none;border:0;color:#8CC4FF;font-weight:700;cursor:pointer;padding:4px}
#gate .check{color:rgba(255,255,255,.85)}

/* cartellino digitale */
.tessera{position:relative;border-radius:20px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#1677D2 0%,#0B2F6B 55%,#081446 100%);box-shadow:0 14px 34px rgba(8,20,70,.35);padding:16px;display:grid;grid-template-columns:96px 1fr;gap:12px 14px;max-width:440px;width:100%;margin:0 auto}
.tessera .piede{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px;font-size:13px;z-index:1}
.tessera .piede b{font-family:var(--display);font-size:17px;letter-spacing:.05em}
.tessera::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.tessera .top{grid-column:1/-1;display:flex;align-items:center;gap:10px;z-index:1}
.tessera .top img{width:34px;height:34px;border-radius:9px;background:#fff;padding:2px}
.tessera .top b{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.tessera .top span{font-size:11px;opacity:.8;display:block}
.tessera .foto{width:96px;height:120px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;z-index:1}
.tessera .dati{display:flex;flex-direction:column;gap:2px;min-width:0;z-index:1}
.tessera .nome{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.05;text-transform:uppercase}
.tessera .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:4px}
.tessera .v{font-size:14px;font-weight:600}
.tessera .stato{margin-left:auto;align-self:flex-start;z-index:1;font-weight:800;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:99px;background:#1E8A4F}
.tessera.scaduto{filter:grayscale(.85)}
.tessera.scaduto .stato,.tessera.sospeso .stato{background:#D23A2E}

#home{position:fixed;inset:0;background:var(--sfondo);color:#fff;overflow:hidden}
#home:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,10,40,0) 30%,rgba(5,10,40,.45) 55%,rgba(5,10,40,.8) 100%);pointer-events:none}
#home .sc{position:absolute;left:0;right:0;top:var(--tb,40%);bottom:0;display:flex;flex-direction:column;align-items:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(72px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#home .mid{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:440px}
#home h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:3px;text-transform:uppercase;text-align:center;margin:0 0 4px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#home .sub{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;text-align:center;color:#e8c77a;margin:0 0 14px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#home .camp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#home .c{display:block;color:#fff;text-decoration:none;border-radius:22px;padding:14px 8px;text-align:center;background:rgba(10,18,60,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);transition:transform .15s ease}
#home .c:active{transform:scale(.96)}
#home .c.f{box-shadow:0 0 0 1px rgba(56,189,248,.5),0 10px 30px rgba(34,184,240,.25)}
#home .c.l{box-shadow:0 0 0 1px rgba(217,70,239,.5),0 10px 30px rgba(192,38,211,.25)}
#home .c img{height:132px;max-height:17vh;display:block;margin:0 auto 8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
#home .n{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.5px;line-height:1.05}
#home .s{font-size:12.5px;opacity:.75;margin-top:3px}
#home .acc{text-align:center;font-size:14px;opacity:.95}
#home .acc a{display:inline-block;margin-top:4px;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:600;color:#fff;text-decoration:none}
.vin{animation:fi .35s ease}
.indietro{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));z-index:2;background:rgba(6,12,40,.55);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.band .casa{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;width:36px;height:36px;font-size:20px;font-weight:700;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}

/* pagina pubblica del campionato */
.band.camp-f{box-shadow:inset 0 -4px 0 #22b8f0}
.band.camp-l{box-shadow:inset 0 -4px 0 #c026d3}
.band img.marchio{width:60px;height:69px;border-radius:0;background:none;padding:0;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}

.band img.clogo{width:64px;height:77px;border-radius:0;background:none;padding:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}

const segSub = (k, l) => `<div class="seg" role="tablist">${l.map(([id, t]) => `<button data-sub="${k}:${id}" aria-pressed="${(S.sub[k] || l[0][0]) === id}">${t}</button>`).join('')}</div>`;
/* card di una partita nella pagina pubblica */
function cardPar(p){
  const fin = p.gc != null && p.go != null && p.giocata;
  const mid = fin ? `<span class="st">Finale</span><span class="num">${+p.gc} : ${+p.go}</span>`
    : p.stato === 'rinviata' ? '<span class="st no">Rinviata</span><span class="ora">– : –</span>'
    : p.data ? `<span class="st prox">${GIORNI[dataObj(p.data).getDay()]}</span><span class="ora">${esc(p.ora || '--:--')}</span>`
    : '<span class="st">Da definire</span><span class="ora">– : –</span>';
  const piede = [p.impianto, p.data ? giornoCorto(p.data) : 'Data da definire'].filter(Boolean).join(' · ');
  return `<div class="m"><div class="tm">${stemma(p.casa)}<span>${esc(p.casa)}</span></div><div class="sc">${mid}</div><div class="tm">${stemma(p.ospite)}<span>${esc(p.ospite)}</span></div>
    <div class="ft">${esc(piede)}</div>${p.arbitro && !fin ? `<div class="arb">Arbitro: <b>${esc(p.arbitro)}</b></div>` : ''}</div>`;
}
function renderCamp(app, v){
  const C = CAMP[v]; pubStart();
  const l = S.pubSq.filter(q => q.categoria === C.cat).sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'it'));
  const tabs = [['par', 'Partite'], ['cl', 'Classifica'], ['gio', 'Giocatori'], ['dis', 'Disciplina']];
  const t = S.ptab, sb = k => S.sub[k];
  let body;
  if(!S.pubLoaded) body = '<div class="status"><span class="spin"></span>Carico…</div>';
  else if(S.pubErr) body = `<p class="err">${esc(S.pubErr)}</p>`;
  else if(t === 'par'){
    const lp = parDi(S.pubPar, C.cat), giorn = giornateDi(lp);
    if(!S.pubParOk) body = '<div class="status"><span class="spin"></span>Carico…</div>';
    else if(!lp.length) body = testa('Partite', 'Campionato') + vuoto('Calendario in arrivo', 'Qui compariranno le partite giornata per giornata: data, ora e campo. Appena giocate, il risultato e chi ha segnato.');
    else {
      let g = S.pgPub[v]; if(!giorn.includes(g)) g = S.pgPub[v] = gioDefault(lp, giorn);
      const lg = lp.filter(p => +p.giornata === g).sort(ordPar), inGioco = new Set(lg.flatMap(p => [p.casaId, p.ospiteId]));
      const riposa = l.filter(q => !inGioco.has(q.id)).map(q => q.nome);
      body = testa('Partite', 'Campionato') + `<div class="seg gior" role="tablist" aria-label="Giornate">${giorn.map(n => `<button data-gp="${n}" aria-pressed="${n === g}">${n}ª giornata</button>`).join('')}</div>
        <div class="card par">${lg.map(cardPar).join('')}</div>${riposa.length && riposa.length < l.length ? `<p class="note">Riposa: ${esc(riposa.join(', '))}</p>` : ''}`;
    }
  }
  else if(t === 'cl') body = testa('Classifica', 'Campionato') + (l.length ? `<table class="tab-cl"><thead><tr><th class="pos"></th><th class="sq">Squadre</th><th>Pti</th><th>G</th><th>V</th><th>N</th><th>P</th><th>DR</th></tr></thead>
      <tbody>${l.map((q, i) => `<tr><td class="pos">${i + 1}</td><td class="sq">${stemma(q.nome)}${esc(q.nome)}</td><td class="pt">0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`).join('')}</tbody></table>
      <p class="note">Il campionato non è ancora iniziato. Vittoria 3 punti, pareggio 1. A pari punti contano scontri diretti, differenza reti, gol fatti e disciplina.</p>`
      : vuoto('Squadre in arrivo', 'Le squadre del campionato non sono ancora state inserite.'));
  else if(t === 'gio'){
    const k = sb('gio') || 'mar';
    body = segSub('gio', [['mar', 'Marcatori'], ['mvp', 'Migliore in campo'], ['por', 'Miglior portiere']]) + ({
      mar: vuoto('Ancora nessun gol', 'La classifica marcatori si riempie con i gol scritti nei referti degli arbitri.'),
      mvp: vuoto('Ancora nessuna partita', 'A fine partita l’arbitro sceglie il migliore in campo: qui la classifica di chi è stato scelto più volte.'),
      por: vuoto('Ancora nessuna partita', 'A fine partita l’arbitro sceglie il miglior portiere: qui la classifica di chi è stato scelto più volte.')}[k]);
  } else {
    const k = sb('dis') || 'squ';
    body = segSub('dis', [['squ', 'Squalificati'], ['dif', 'Diffidati'], ['car', 'Cartellini']]) + ({
      squ: vuoto('Nessuno squalificato', 'Qui i giocatori che devono saltare la prossima partita e per quante giornate.'),
      dif: vuoto('Nessun diffidato', 'Qui i giocatori con 3 ammonizioni: alla prossima ammonizione scatta la squalifica.'),
      car: vuoto('Nessun cartellino', 'Qui ammonizioni ed espulsioni di ogni giocatore e il totale per squadra.')}[k])
      + `<ul class="regole"><li>Doppia ammonizione nella stessa partita: 1 giornata di squalifica.</li><li>Ogni 4 ammonizioni: 1 giornata di squalifica.</li><li>Espulsione diretta: le giornate le decide l’amministratore del torneo.</li></ul>`;
  }
  app.dataset.v = 'camp-' + v;
  app.className = 'con-tabs ' + C.cls + '-app';
  app.innerHTML = `<header class="band ${C.cls}"><div class="band-in"><button class="casa" data-home aria-label="Torna alla pagina iniziale">‹</button><img class="clogo" src="${C.logo}" alt=""><div><h1>${C.nome}</h1><div class="sub">${C.sub}</div></div></div></header>
    <main class="wrap stack">${body}</main>
    <div class="tabbar"><nav aria-label="Sezioni">${tabs.map(([k, n]) => `<button data-pt="${k}"${t === k ? ' aria-current="page"' : ''}>${svg(k)}${n}</button>`).join('')}</nav></div>`;
  bindHome(app);
  app.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { S.ptab = b.dataset.pt; render(); window.scrollTo(0, 0); });
  app.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { const [k, id] = b.dataset.sub.split(':'); S.sub[k] = id; render(); });
  app.querySelectorAll('[data-gp]').forEach(b => b.onclick = () => { S.pgPub[v] = +b.dataset.gp; render(); });
  const gs = app.querySelector('.gior [aria-pressed=true]'); if(gs) gs.scrollIntoView({block: 'nearest', inline: 'center'});
}

  const s = statoT(t); if(S.admin || s === 'approvato' || s === 'sospeso' || s === 'scaduto') openCard(t); else openTess(t); });

/* foto: ridotta sul telefono prima di salvarla */
const riduci = file => new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => { const W = 300, H = 375, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    const r = Math.max(W / img.width, H / img.height), w = img.width * r, h = img.height * r; x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .72)); };
  img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; img.src = u; });

/* -- scheda tesserato (nuovo o da correggere; l'amministratore modifica sempre) -- */
function openTess(t){
  const root = $('#sheetRoot'), isNew = !t.id, close = () => root.innerHTML = '';
  let foto = t.foto || '';
  const sq = S.admin ? `<div class="field full"><label for="t-sq">Squadra</label><select id="t-sq">${CATS.map(c => `<optgroup label="${c}">${S.squadre.filter(q => q.categoria === c).map(q => `<option value="${esc(q.id)}" ${q.id === t.squadraId ? 'selected' : ''}>${esc(q.nome)}</option>`).join('')}</optgroup>`).join('')}</select></div>` : '';
  const inp = (f, l, type = 'text', full = false, ex = '') => `<div class="field${full ? ' full' : ''}"><label for="t-${f}">${l}</label><input id="t-${f}" type="${type}" value="${esc(t[f] || '')}" ${ex}></div>`;
  root.innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Tesserato"><div class="grab"></div>
    <form class="form" id="tForm"><h3>${isNew ? 'Nuovo tesserato' : nomeT(t)}</h3>
    ${t.stato === 'rifiutato' && !S.admin ? `<div class="warn-box full" style="grid-column:1/-1">Rifiutato dall’amministratore${t.motivo ? ': <b>' + esc(t.motivo) + '</b>' : ''}. Correggi e invia di nuovo.</div>` : ''}
    <div class="foto-pick"><span id="t-fprev">${foto ? `<img src="${esc(foto)}" alt="Foto">` : '<span class="ph">Foto<br>tessera</span>'}</span>
      <div class="stack" style="gap:6px"><label class="btn btn-ghost sm" for="t-file">📷 ${foto ? 'Cambia foto' : 'Aggiungi foto'}</label><input id="t-file" type="file" accept="image/*" hidden><span class="note">Foto del viso, come quella del documento.</span></div></div>
    ${sq}${inp('cognome', 'Cognome', 'text', false, 'required autocapitalize="words"')}${inp('nome', 'Nome', 'text', false, 'required autocapitalize="words"')}
    ${inp('dataNascita', 'Data di nascita', 'date', false, 'required')}${inp('luogoNascita', 'Luogo di nascita')}
    <div class="field"><label for="t-ruolo">Ruolo</label><select id="t-ruolo">${RUOLI.map(x => `<option ${x === (t.ruolo || 'Giocatore') ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    ${inp('numero', 'Numero di maglia', 'number', false, 'min="0" max="99" inputmode="numeric"')}
    ${inp('documento', 'Documento (tipo e numero)', 'text', true, 'placeholder="Es. Carta d’identità CA12345AB"')}
    ${isNew || !S.admin ? `<label class="check"><input type="checkbox" id="t-ok" required ${t.consenso && !isNew ? 'checked' : ''}><span>Il tesserato (o un genitore, se minorenne) ha dato il consenso all’uso dei suoi dati per il torneo AICS.</span></label>` : ''}
    <div class="actions"><button class="btn btn-primary" id="tSave">${S.admin ? (isNew ? 'Aggiungi e approva' : 'Salva') : isNew ? 'Invia all’amministratore' : 'Invia di nuovo'}</button><button type="button" class="btn btn-ghost" data-x>Annulla</button>
    ${!isNew && (S.admin || t.stato !== 'approvato') ? '<button type="button" class="btn btn-danger" data-del>Elimina</button>' : ''}</div></form></div></div>`;
  root.querySelector('.sheet-bg').onclick = e => { if(e.target.classList.contains('sheet-bg')) close(); };
  root.querySelector('[data-x]').onclick = close;
  $('#t-file').onchange = async e => { const f = e.target.files[0]; if(!f) return; try{ foto = await riduci(f); $('#t-fprev').innerHTML = `<img src="${foto}" alt="Foto">`; }catch(err){ toast('Non riesco a leggere questa foto'); } };
  const del = root.querySelector('[data-del]');
  if(del) del.onclick = async () => { if(!confirm(`Eliminare ${nomeT(t)}? I suoi dati vengono cancellati.`)) return; try{ await db().collection('tesserati').doc(t.id).delete(); toast('Tesserato eliminato'); close(); }catch(err){ toast(fbErr(err)); } };
  $('#tForm').onsubmit = async e => {
    e.preventDefault(); const v = id => $('#t-' + id).value.trim();
    const q = S.admin ? sqById($('#t-sq').value) : {id: t.squadraId, nome: t.squadra, categoria: t.categoria};
    const o = {cognome: v('cognome'), nome: v('nome'), dataNascita: v('dataNascita'), luogoNascita: v('luogoNascita'), ruolo: v('ruolo'), numero: v('numero'), documento: v('documento'),
      foto, squadraId: q.id, squadra: q.nome || '', categoria: q.categoria || ''};
    if(o.dataNascita > oggi()){ toast('Controlla la data di nascita'); return; }
    const dup = S.tess.find(x => x.id !== t.id && x.cognome.toLowerCase() === o.cognome.toLowerCase() && x.nome.toLowerCase() === o.nome.toLowerCase() && x.dataNascita === o.dataNascita && statoT(x) !== 'scaduto');
    if(dup && !confirm(`${nomeT(o)} risulta già tesserato${dup.squadraId !== o.squadraId ? ' con ' + dup.squadra : ''}. Salvare lo stesso?`)) return;
    const col = db().collection('tesserati'), b = $('#tSave'); b.disabled = true;
    try{
      if(S.admin){
        if(isNew) await col.add({...o, ...approva(o), consenso: true, creatoDa: S.user.uid, createdAt: Date.now()});
        else await col.doc(t.id).update(o);
        toast(isNew ? 'Tesserato aggiunto e approvato' : 'Modifiche salvate');
      } else {
        const x = {...o, stato: 'attesa', consenso: true, motivo: ''};
        if(isNew) await col.add({...x, creatoDa: S.user.uid, createdAt: Date.now()}); else await col.doc(t.id).update(x);
        toast('Inviato: l’amministratore lo controlla e lo approva');
      }
      close();
    }catch(err){ b.disabled = false; toast(fbErr(err)); }
  };
}
/* dati che l'approvazione aggiunge: scadenza al 30 giugno, codice del cartellino, cancellazione un anno dopo */
function approva(t){
  const sc = fineStagione();
  return {stato: 'approvato', scadenza: sc, scadenzaMs: msDopo(sc), cancellaDopo: unAnnoDopo(sc), approvatoAt: Date.now(), approvatoDa: S.user.email, motivo: '',
    codice: t.codice || `${/7/.test(t.categoria || '') ? 'C7' : 'C5'}-${sc.slice(2, 4)}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`};
}

/* ===================== PARTITE E CALENDARIO ===================== */
const stagioneDi = (d = new Date()) => { const a = d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; return `${a}/${String((a + 1) % 100).padStart(2, '0')}`; };
const STAG = stagioneDi();
const NOMECAMP = {'C5 AICS': 'Futsal League', 'C7 AICS': 'R.E. Liga'};
const GIORNI = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const GG = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const dataObj = iso => { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, m - 1, d); };
const giornoCorto = iso => iso ? `${GG[dataObj(iso).getDay()]} ${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const tariffa = c => /7/.test(c) ? 30 : 25;
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const ordPar = (a, b) => (a.data || '9999') .localeCompare(b.data || '9999') || (a.ora || '').localeCompare(b.ora || '') || (a.casa || '').localeCompare(b.casa || '');
const parDi = (l, cat) => l.filter(p => p.camp === cat && (p.stagione || STAG) === STAG);
const giornateDi = l => [...new Set(l.map(p => +p.giornata || 0))].sort((a, b) => a - b);
const desDi = p => p.desId ? S.des.find(d => d.id === p.desId) : null;
const refFatto = d => d && Object.values(d.referti || {}).some(r => r && !r.sbloccato);
/* stato della partita per l'amministratore */
function statoPar(p){
  const d = desDi(p);
  if(refFatto(d)) return ['ok', 'Referto arrivato'];
  if(p.stato === 'rinviata') return ['no', 'Rinviata'];
  if(!p.data) return ['grigio', 'Da programmare'];
  if(!p.desId) return ['wait', p.ora && p.impianto ? 'Non è nell’app arbitri: tocca Salva' : 'Manca ora o campo'];
  if(!d) return ['wait', 'In app arbitri'];
  if(d.annullata && !(d.ufficiali || []).length) return ['no', 'Da riprogrammare'];
  const u = (d.ufficiali || [])[0];
  if(!u) return ['wait', 'Da designare'];
  const r = (d.risposte || {})[u.uid];
  return r && r.stato === 'accettata' ? ['ok', 'Arbitro: ' + (u.nome || '')] : ['wait', 'Arbitro: ' + (u.nome || '') + ' · in attesa'];
}

/* --- generatore all'italiana (metodo del cerchio) --- */
function generaRR(teams, ritorno){
  const t = teams.slice(); if(t.length % 2) t.push(null);
  const n = t.length, out = [];
  for(let r = 0; r < n - 1; r++){
    for(let i = 0; i < n / 2; i++){
      let a = t[i], b = t[n - 1 - i];
      if(i === 0 ? r % 2 === 1 : i % 2 === 1) [a, b] = [b, a];
      if(a && b) out.push({giornata: r + 1, c: a, o: b});
    }
    t.splice(1, 0, t.pop());
  }
  if(ritorno) out.slice().forEach(m => out.push({giornata: m.giornata + n - 1, c: m.o, o: m.c}));
  return out;
}
function openGenera(){
  const cat = S.pcat; let teams = squadreCat(cat), rit = true;
  if(teams.length < 2){ toast('Servono almeno 2 squadre ' + NOMECAMP[cat]); return; }
  const draw = () => {
    const m = generaRR(teams, rit), rows = m.map(x => ({giornata: x.giornata, casa: x.c.nome, ospite: x.o.nome}));
    const {root, close} = sheet(`<h3>Genera il calendario</h3><p class="note">${esc(NOMECAMP[cat])} · ${teams.length} squadre${teams.length % 2 ? ' (ogni giornata una squadra riposa)' : ''} · ${m.length} partite in ${Math.max(...m.map(x => x.giornata))} giornate.</p>
      <div class="seg"><button data-r="0" aria-pressed="${!rit}">Solo andata</button><button data-r="1" aria-pressed="${rit}">Andata e ritorno</button></div>
      <button class="btn btn-ghost btn-block" id="gMix">🔀 Mescola l’ordine delle squadre</button>
      ${anteprima(rows)}
      <button class="btn btn-primary btn-block" id="gOk">Crea queste ${m.length} partite</button><button class="btn btn-ghost btn-block" data-x>Annulla</button>`, 'Genera calendario');
    root.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rit = b.dataset.r === '1'; draw(); });
    root.querySelector('#gMix').onclick = () => { teams = teams.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]); draw(); };
    root.querySelector('#gOk').onclick = async e => { e.target.disabled = true;
      try{ await scriviTutto(m.map(x => b => b.set(db().collection('partite').doc(), nuovaPar(cat, x.giornata, x.c, x.o)))); S.pgio[cat] = 1; toast('Calendario creato'); close(); }
      catch(err){ e.target.disabled = false; toast(fbErr(err)); } };
  };
  draw();
}
/* --- importazione da file --- */
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let xlsxP = null;
const caricaXlsx = () => xlsxP || (xlsxP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = XLSX_URL; s.onload = () => res(window.XLSX); s.onerror = () => { xlsxP = null; rej(new Error('net')); }; document.head.appendChild(s); }));
const leggiCsv = txt => { const righe = txt.replace(/^﻿/, '').split(/\r?\n/).filter(r => r.trim()); const sep = [';', '\t', ','].find(c => (righe[0] || '').includes(c)) || ';';
  return righe.map(r => r.split(sep).map(c => c.replace(/^"|"$/g, '').trim())); };
function scaricaModello(){
  const t = squadreCat(S.pcat), es = t.length > 1 ? [`1;${t[0].nome};${t[1].nome}`] : ['1;SQUADRA A;SQUADRA B'];
  const blob = new Blob(['﻿Giornata;Casa;Ospite\n' + es.join('\n') + '\n'], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `calendario-${NOMECAMP[S.pcat].replace(/\W+/g, '-').toLowerCase()}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function openImporta(){
  const cat = S.pcat, teams = squadreCat(cat), byN = new Map(teams.map(q => [norm(q.nome), q]));
  const {root, close} = sheet(`<h3>Importa il calendario</h3>
    <p class="note">Un file Excel (.xlsx) o CSV con 3 colonne: <b>Giornata</b>, <b>Casa</b>, <b>Ospite</b>. I nomi delle squadre devono essere uguali a quelli dell’archivio squadre di ${esc(NOMECAMP[cat])}.</p>
    <button class="btn btn-ghost btn-block" id="iMod">⬇️ Scarica il modello da compilare</button>
    <label class="btn btn-primary btn-block" for="iFile">📄 Scegli il file</label><input type="file" id="iFile" accept=".csv,.xlsx,.xls,text/csv" hidden>
    <div id="iOut"></div><button class="btn btn-ghost btn-block" data-x>Chiudi</button>`, 'Importa calendario');
  root.querySelector('#iMod').onclick = scaricaModello;
  root.querySelector('#iFile').onchange = async e => {
    const f = e.target.files[0], out = root.querySelector('#iOut'); if(!f) return;
    out.innerHTML = '<div class="status"><span class="spin"></span>Leggo il file…</div>';
    let rows;
    try{
      if(/\.xlsx?$/i.test(f.name)){ const X = await caricaXlsx(); const wb = X.read(await f.arrayBuffer(), {type: 'array'}); rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: false}).map(r => r.map(c => String(c ?? '').trim())); }
      else rows = leggiCsv(await f.text());
    }catch(err){ out.innerHTML = '<p class="err">Non riesco a leggere il file. Prova a salvarlo come CSV.</p>'; return; }
    rows = rows.filter(r => r.some(Boolean));
    if(rows.length && !/^\d+/.test(rows[0][0] || '')) rows.shift();
    const err = [], ok = [];
    rows.forEach((r, i) => { const g = parseInt(r[0], 10), c = byN.get(norm(r[1])), o = byN.get(norm(r[2]));
      if(!g) err.push(`Riga ${i + 2}: manca il numero della giornata`);
      else if(!c || !o) err.push(`Riga ${i + 2}: ${[!c && `“${r[1] || ''}”`, !o && `“${r[2] || ''}”`].filter(Boolean).join(' e ')} non ${!c && !o ? 'sono' : 'è'} nell’archivio squadre`);
      else if(c.id === o.id) err.push(`Riga ${i + 2}: casa e ospite sono la stessa squadra`);
      else ok.push({giornata: g, c, o}); });
    if(!ok.length && !err.length){ out.innerHTML = '<p class="err">Il file è vuoto.</p>'; return; }
    if(err.length){ out.innerHTML = `<div class="warn-box"><b>Da correggere prima di importare (${err.length}):</b><br>${err.slice(0, 15).map(esc).join('<br>')}${err.length > 15 ? '<br>…' : ''}</div><p class="note">Squadre in archivio: ${teams.map(q => esc(q.nome)).join(', ') || 'nessuna'}.</p>`; return; }
    out.innerHTML = `<p class="note">${ok.length} partite in ${new Set(ok.map(x => x.giornata)).size} giornate.</p>${anteprima(ok.map(x => ({giornata: x.giornata, casa: x.c.nome, ospite: x.o.nome})))}<button class="btn btn-primary btn-block" id="iOk">Importa ${ok.length} partite</button>`;
    root.querySelector('#iOk').onclick = async ev => { ev.target.disabled = true;
      try{ await scriviTutto(ok.map(x => b => b.set(db().collection('partite').doc(), nuovaPar(cat, x.giornata, x.c, x.o)))); toast('Calendario importato'); close(); }
      catch(e2){ ev.target.disabled = false; toast(fbErr(e2)); } };
  };
}

/* --- scheda della partita: data, ora, campo; poi passa all'app arbitri --- */
function openPartita(p){
  if(!p) return;
  const isNew = !p.id, cat = p.camp, teams = squadreCat(cat), d = desDi(p), fatto = refFatto(d);
  const imp = S.impianti.slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'it'));
  const opt = (l, sel) => l.map(q => `<option value="${esc(q.id)}" ${q.id === sel ? 'selected' : ''}>${esc(q.nome)}${q.citta ? ' · ' + esc(q.citta) : ''}</option>`).join('');
  const [k, t] = isNew ? ['', ''] : statoPar(p);
  const {root, close} = sheet(`<form class="form" id="pForm"><h3>${isNew ? 'Nuova partita' : esc(p.casa) + ' – ' + esc(p.ospite)}</h3>
    <p class="note" style="grid-column:1/-1">${esc(NOMECAMP[cat])} · stagione ${esc(p.stagione || STAG)}${isNew ? '' : ` · <span class="pst ${k}">${esc(t)}</span>`}</p>
    ${fatto ? '<div class="warn-box" style="grid-column:1/-1">L’arbitro ha già mandato il referto: squadre, data e campo non si possono più cambiare.</div>' : ''}
    <div class="field"><label for="p-g">Giornata</label><input id="p-g" type="number" min="1" inputmode="numeric" value="${esc(p.giornata || '')}" required></div>
    <div class="field"><label for="p-st">Stato</label><select id="p-st"><option value="">Regolare</option><option value="rinviata" ${p.stato === 'rinviata' ? 'selected' : ''}>Rinviata</option></select></div>
    <div class="field full"><label for="p-c">Squadra di casa</label><select id="p-c" required><option value="">Scegli…</option>${opt(teams, p.casaId)}</select></div>
    <div class="field full"><label for="p-o">Squadra ospite</label><select id="p-o" required><option value="">Scegli…</option>${opt(teams, p.ospiteId)}</select></div>
    <div class="field"><label for="p-d">Data</label><input id="p-d" type="date" value="${esc(p.data || '')}"></div>
    <div class="field"><label for="p-h">Ora</label><input id="p-h" type="time" value="${esc(p.ora || '')}"></div>
    <div class="field full"><label for="p-i">Campo</label><select id="p-i"><option value="">Scegli il campo…</option>${opt(imp, p.impiantoId)}</select></div>
    ${imp.length ? '' : '<p class="note" style="grid-column:1/-1">L’archivio campi è vuoto: aggiungili nell’app arbitri (Designazioni → Campi).</p>'}
    <p class="note" style="grid-column:1/-1">Con data, ora e campo la partita passa da sola nell’app arbitri tra le gare da designare. Se poi li cambi, la modifica arriva anche lì e l’arbitro deve riconfermare.</p>
    <div class="err" id="pErr" style="grid-column:1/-1"></div>
    <div class="actions"><button class="btn btn-primary" id="pGo">${isNew ? 'Aggiungi' : 'Salva'}</button><button type="button" class="btn btn-ghost" data-x>Annulla</button></div>
    ${isNew ? '' : '<button type="button" class="btn btn-danger btn-block" id="pDel" style="grid-column:1/-1">Elimina partita</button>'}</form>`, 'Partita');
  const f = root.querySelector('#pForm'), v = id => root.querySelector('#' + id).value.trim();
  if(fatto) ['p-c', 'p-o', 'p-d', 'p-h', 'p-i', 'p-st'].forEach(id => root.querySelector('#' + id).disabled = true);
  f.onsubmit = async e => {
    e.preventDefault(); const er = root.querySelector('#pErr'), btn = root.querySelector('#pGo'); er.textContent = '';
    const c = teams.find(q => q.id === v('p-c')), o = teams.find(q => q.id === v('p-o')), im = S.impianti.find(x => x.id === v('p-i'));
    if(!c || !o){ er.textContent = 'Scegli le due squadre.'; return; }
    if(c.id === o.id){ er.textContent = 'Casa e ospite sono la stessa squadra.'; return; }
    const n = {giornata: parseInt(v('p-g'), 10) || 1, casa: c.nome, casaId: c.id, ospite: o.nome, ospiteId: o.id, data: v('p-d'), ora: v('p-h'),
      impianto: im ? im.nome : '', impiantoId: im ? im.id : '', indirizzo: im ? im.indirizzo || '' : '', citta: im ? im.citta || '' : '', stato: v('p-st'), updatedAt: Date.now()};
    btn.disabled = true;
    try{ await salvaPartita(isNew ? {...nuovaPar(cat, n.giornata, c, o), ...n} : {...p, ...n}, p, im); S.pgio[cat] = n.giornata; toast(isNew ? 'Partita aggiunta' : 'Partita salvata'); close(); }
    catch(err){ btn.disabled = false; er.textContent = err.msg || fbErr(err); }
  };
  const del = root.querySelector('#pDel');
  if(del) del.onclick = async () => {
    if(d && ((d.ufficiali || []).length || fatto)){ toast('C’è già un arbitro: prima annulla la gara nell’app arbitri'); return; }
    if(!confirm(`Eliminare ${p.casa} – ${p.ospite}?${d ? '\n\nViene tolta anche dall’app arbitri.' : ''}`)) return;
    try{ await scriviTutto([b => b.delete(db().collection('partite').doc(p.id)), ...(d ? [b => b.delete(db().collection('designazioni').doc(d.id))] : [])]); toast('Partita eliminata'); close(); }catch(e){ toast(fbErr(e)); }
  };
}
/* salva la partita e tiene allineata la designazione nell'app arbitri */
async function salvaPartita(n, old, im){
  const col = db().collection('partite'), ref = n.id ? col.doc(n.id) : col.doc(), d = desDi(old || {}), now = Date.now();
  const {id, ...dati} = n, ops = [];
  const pronta = n.data && n.ora && n.impianto && n.stato !== 'rinviata';
  const geo = im && im.lat && im.lng ? {lat: +im.lat, lng: +im.lng} : {lat: null, lng: null};
  const info = {data: n.data, ora: n.ora, categoria: n.camp, casa: n.casa, ospite: n.ospite, impianto: n.impianto, indirizzo: n.indirizzo, citta: n.citta, mapsUrl: im ? im.mapsUrl || '' : '', ...geo};
  if(!d && pronta){
    const dref = db().collection('designazioni').doc();
    ops.push(b => b.set(dref, {...info, girone: '', numeroGara: '', rimborso: tariffa(n.camp), note: '', ufficiali: [], arbitriIds: [], cronologia: [], risposte: {}, referti: {}, avvisi: {}, inviate: {}, sostituzioni: {}, subentri: {}, sostituiti: [], storico: [], partitaId: ref.id, giornata: n.giornata, createdAt: now, updatedAt: now}));
    dati.desId = dref.id;
  } else if(d && !refFatto(d)){
    const CAMPI = ['data', 'ora', 'casa', 'ospite', 'impianto'], ug = (a, b) => String(a || '') === String(b || '');
    if(n.stato === 'rinviata' && !d.annullata){
      const nomi = (d.ufficiali || []).map(u => u.nome).filter(Boolean);
      ops.push(b => b.update(db().collection('designazioni').doc(d.id), {ufficiali: [], arbitriIds: [], risposte: {}, referti: {}, avvisi: {}, inviate: {}, sostituzioni: {}, subentri: {}, sostituiti: [], modifiche: null,
        annullata: {at: now, motivo: 'Partita rinviata', arbitri: nomi}, cronologia: [...(d.cronologia || []), {at: now, annullata: true, motivo: 'Partita rinviata', voci: nomi.length ? [{k: 'arbitri', da: nomi.join(', '), a: ''}] : []}], updatedAt: now}));
    } else if(n.stato !== 'rinviata'){
      const camb = CAMPI.filter(k => !ug(d[k], info[k]));
      if(camb.length && n.data){
        const upd = {...info, giornata: n.giornata, updatedAt: now, risposte: {}, avvisi: {}, inviate: {}, cronologia: [...(d.cronologia || []), {at: now, voci: camb.map(k => ({k: k === 'casa' || k === 'ospite' ? 'squadre' : k, da: k === 'casa' || k === 'ospite' ? `${d.casa} – ${d.ospite}` : d[k] || '', a: k === 'casa' || k === 'ospite' ? `${n.casa} – ${n.ospite}` : info[k]}))
          .filter((x, i, a) => a.findIndex(y => y.k === x.k) === i)}]};
        if(d.annullata) Object.assign(upd, {annullata: firebase.firestore.FieldValue.delete(), modifiche: null});
        else upd.modifiche = {at: now, campi: camb, prima: Object.fromEntries(CAMPI.map(k => [k, d[k] || ''])), per: d.arbitriIds || []};
        ops.push(b => b.update(db().collection('designazioni').doc(d.id), upd));
      }
    }
  }
  if(n.stato !== 'rinviata' && old && old.stato === 'rinviata' && !n.data){ const e = new Error('data'); e.msg = 'Per togliere “rinviata” metti la nuova data.'; throw e; }
  ops.unshift(b => b.set(ref, dati, {merge: true}));
  await scriviTutto(ops);
}
