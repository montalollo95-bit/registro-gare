<style>
:root{
  --bg:#EEF3FA;--surface:#FFFFFF;--surface-2:#E3EAF4;--line:#CBD6E5;--fg:#0E1A33;--muted:#56627A;
  --blue:#1677D2;--blue-deep:#0B2F6B;--navy:#081446;--ink:#FFFFFF;
  --yellow:#F0B400;--red:#D23A2E;--ok:#1E8A4F;--warn:#A85B05;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#060D24;--surface:#0E1838;--surface-2:#16224A;--line:#25325C;--fg:#E8EEFA;--muted:#9AA7C4;
  --blue:#3B8FE6;--ok:#46C07F;--warn:#E8A33C;--red:#F0604F;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.note{font-size:13px;color:var(--muted);margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}

/* testata */
.band{background:linear-gradient(90deg,rgba(5,12,40,.5) 0%,rgba(5,12,40,.4) 60%,rgba(5,12,40,.3) 100%),url(../sfondo-barra.jpg?v=2) 92% 42%/max(165%,640px) auto no-repeat,#0B1640;color:var(--ink);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 24px 24px;margin-bottom:16px}
.band-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px}
.band img{width:52px;height:52px;border-radius:14px;background:#fff;padding:4px;object-fit:contain;flex:none}
.band h1{font-size:30px;font-weight:800;text-transform:uppercase;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.band .sub{opacity:.85;font-size:14px}
.band .out{margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}

/* elementi */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;min-height:46px;text-decoration:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--fg)}
.btn-ok{background:#1E8A4F;color:#fff}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:22px;margin-bottom:6px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--surface-2);font-size:12px;font-weight:700;text-align:center;margin-left:4px;color:var(--fg)}
.cnt.hot{background:var(--red);color:#fff}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:left;cursor:pointer}
.item .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:15px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item .tx b{overflow-wrap:anywhere}
.item .tx span{font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-attesa{background:rgba(232,163,60,.18);color:var(--warn)}
.b-approvato{background:rgba(30,138,79,.16);color:var(--ok)}
.b-rifiutato,.b-sospeso,.b-revocato{background:rgba(210,58,46,.14);color:var(--red)}
.b-scaduto,.b-svincolato{background:var(--surface-2);color:var(--muted)}
.empty{text-align:center;padding:26px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty h3{color:var(--fg);font-size:22px;margin-bottom:4px}
.status{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--red);font-weight:600}
.warn-box{background:rgba(232,163,60,.14);border:1px solid rgba(232,163,60,.45);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:14px}

/* moduli */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;grid-column:1/-1}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
.foto-pick{display:flex;align-items:center;gap:14px;grid-column:1/-1}
.foto-pick img,.foto-pick .ph{width:84px;height:104px;border-radius:12px;object-fit:cover;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;flex:none}
.actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}

/* foglio in basso */
.sheet-bg{position:fixed;inset:0;background:rgba(3,8,25,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s ease}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:su .28s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-size:26px;grid-column:1/-1}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0E1A33;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* pagina di accesso */
#gate{min-height:100vh;min-height:100dvh;background:var(--sfondo);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));color:#fff}
#gate .in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;animation:su .5s cubic-bezier(.2,.8,.2,1)}
#gate .logo{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:92px;height:92px;border-radius:22px;background:#fff;padding:8px;object-fit:contain;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#gate h1{font-size:26px;text-transform:uppercase;text-align:center;line-height:1}
#gate{position:relative}
#gate .glass{background:rgba(6,12,40,.7);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:12px}
#gate .glass .note{color:rgba(255,255,255,.75)}
#gate .field label{color:rgba(255,255,255,.7)}
#gate .field input,#gate .field select{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.22);color:#fff}
#gate .field select option{color:#000}
#gate .seg{background:rgba(255,255,255,.1);padding:4px;margin:0;border-radius:14px;overflow:visible}
#gate .seg button{color:rgba(255,255,255,.7)}
#gate .seg button{background:transparent;border-color:rgba(255,255,255,.28);color:rgba(255,255,255,.8)}
#gate .seg button[aria-pressed=true]{background:rgba(255,255,255,.95);color:#081446;border-color:#fff}
#gate .link{background:none;border:0;color:#8CC4FF;font-weight:700;cursor:pointer;padding:4px}
#gate .check{color:rgba(255,255,255,.85)}

/* cartellino digitale */
.tessera{position:relative;border-radius:20px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#1677D2 0%,#0B2F6B 55%,#081446 100%);box-shadow:0 14px 34px rgba(8,20,70,.35);padding:16px;display:grid;grid-template-columns:96px 1fr;gap:12px 14px;max-width:440px;width:100%;margin:0 auto}
.tessera .piede{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px;font-size:13px;z-index:1}
.tessera .piede b{font-family:var(--display);font-size:17px;letter-spacing:.05em}
.tessera::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.tessera .top{grid-column:1/-1;display:flex;align-items:center;gap:10px;z-index:1}
.tessera .top img{width:34px;height:34px;border-radius:9px;background:#fff;padding:2px}
.tessera .top b{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.tessera .top span{font-size:11px;opacity:.8;display:block}
.tessera .top .tstem{opacity:1;flex:none;align-self:flex-start;display:block;width:34px;height:34px}.tessera .top .tstem .stemma{display:flex;width:34px;height:34px;margin:0;font-size:12px;border-radius:9px;opacity:1}.tessera .top .tstem .stemma.img{background:none}.tessera .top .tstem img{width:100%;height:100%;background:none;padding:0;border-radius:0;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
@media (max-width:380px){.tessera .top .tstem,.tessera .top .tstem .stemma{width:26px;height:26px;font-size:10px}.tessera .top img{width:30px;height:30px}.tessera .top span{font-size:10.5px}.tessera .top b{font-size:16px}.tessera .top{gap:8px}.tessera .stato{font-size:10.5px;padding:4px 8px}}
.tessera .foto{width:96px;height:120px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;z-index:1}
.tessera .dati{display:flex;flex-direction:column;gap:2px;min-width:0;z-index:1}
.tessera .nome{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.05;text-transform:uppercase}
.tessera .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:4px}
.tessera .v{font-size:14px;font-weight:600}
.tessera .stato{white-space:nowrap;flex:none;margin-left:auto;align-self:flex-start;z-index:1;font-weight:800;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:99px;background:#1E8A4F}
.tessera.scaduto,.tessera.svincolato{filter:grayscale(.85)}.tessera.svincolato .stato{background:#5B6577}
.tessera.scaduto .stato,.tessera.sospeso .stato{background:#D23A2E}

#home{position:fixed;inset:0;background:var(--sfondo);color:#fff;overflow:hidden}
#home:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,10,40,0) 30%,rgba(5,10,40,.45) 55%,rgba(5,10,40,.8) 100%);pointer-events:none}
#home .sc{position:absolute;left:50%;width:var(--hw,100%);transform:translateX(-50%);z-index:1;top:var(--tb,40%);bottom:0;display:flex;flex-direction:column;align-items:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(72px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#home .mid{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:440px}
#home h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:3px;text-transform:uppercase;text-align:center;margin:0 0 4px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#home .sub{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;text-align:center;color:#e8c77a;margin:0 0 14px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#home .camp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* schermo largo (PC, tablet): l'immagine resta intera al centro e sfuma ai lati */
#home .hbg{display:none}
@media (min-aspect-ratio:1472/2616){#home,#gate{background:#07144c;isolation:isolate}#home{--cw:var(--hw,100vw)}#gate{--cw:calc(100vh * 1472 / 2616)}
  #home .hbg,#gate:before{content:"";display:block;position:absolute;inset:-40px;z-index:-2;pointer-events:none;background:linear-gradient(180deg,rgba(18,52,170,.65) 0,rgba(18,52,170,.25) 18%,rgba(18,52,170,0) 34%),url(../sfondo-avvio.jpg) center 48%/cover no-repeat;filter:blur(7px) brightness(.75) saturate(1.15)}
  #home:after,#gate:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:url(../sfondo-avvio.jpg) center top/auto 100% no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent calc(50% - var(--cw) / 2),#000 calc(50% - var(--cw) / 2 + 90px),#000 calc(50% + var(--cw) / 2 - 90px),transparent calc(50% + var(--cw) / 2));mask-image:linear-gradient(90deg,transparent calc(50% - var(--cw) / 2),#000 calc(50% - var(--cw) / 2 + 90px),#000 calc(50% + var(--cw) / 2 - 90px),transparent calc(50% + var(--cw) / 2))}
}
#home .c{display:block;color:#fff;text-decoration:none;border-radius:22px;padding:14px 8px;text-align:center;background:rgba(10,18,60,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);transition:transform .15s ease}

#home .c.f{box-shadow:0 0 0 1px rgba(56,189,248,.5),0 10px 30px rgba(34,184,240,.25)}
#home .c.l{box-shadow:0 0 0 1px rgba(217,70,239,.5),0 10px 30px rgba(192,38,211,.25)}
#home .c img{height:132px;max-height:17vh;display:block;margin:0 auto 8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}

#home .s{font-size:12.5px;opacity:.75;margin-top:3px}

.vin{animation:fi .35s ease}

/* pagina pubblica del campionato */
.band.camp-f{box-shadow:inset 0 -4px 0 #22b8f0}
.band.camp-l{box-shadow:inset 0 -4px 0 #c026d3}
.band img.marchio{width:60px;height:69px;border-radius:0;background:none;padding:0;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}

/* ===== grafica dei campionati: stadio sopra e sotto, dentro segue il tema del telefono ===== */
:root{--blue:#3A6BEA;--royal:#3A6BEA;--gold:#C9971A;--card:rgba(255,255,255,.80);--card-bd:rgba(255,255,255,.9);--card-sh:0 8px 24px rgba(30,60,140,.10);
  --fg:#0F1B3D;--muted:#6F7B95;--line:rgba(15,27,61,.09);--surface:var(--card);--surface-2:#E6ECF6;--chip:#E8EDF6;--lbl:#3A6BEA;--ora:#3A6BEA;--av1:#E3EAF8;--av2:#EDF2FB;--avf:#1F3D8A}
@media (prefers-color-scheme:dark){:root{--blue:#3A6BEA;--royal:#3A6BEA;--gold:#E8BE4F;--card:rgba(13,24,58,.80);--card-bd:rgba(255,255,255,.1);--card-sh:0 8px 24px rgba(0,0,0,.25);
  --fg:#EEF3FB;--muted:#9FB0CC;--line:rgba(255,255,255,.09);--surface-2:rgba(255,255,255,.1);--chip:rgba(255,255,255,.1);--lbl:#9CC0FF;--ora:#A9CCFF;--av1:#21325F;--av2:#273A6C;--avf:#CFE0FF}}
body{background:transparent;color:var(--fg)}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  url(logo-sfondo-chiaro.png) center 62%/min(92vw,520px) auto no-repeat,
  radial-gradient(55% 32% at 0% 16%,rgba(96,160,248,.30),transparent 72%),
  radial-gradient(60% 30% at 100% 14%,rgba(222,52,44,.15),transparent 72%),
  radial-gradient(65% 30% at 40% 100%,rgba(60,165,85,.20),transparent 72%),
  radial-gradient(60% 34% at 100% 96%,rgba(62,136,234,.26),transparent 72%),
  linear-gradient(180deg,#EEF3FC 0%,#E7EEFA 55%,#E2EAF9 100%)}
@media (prefers-color-scheme:dark){body:before{background:
  url(../logo-sfondo.png?v=2) center 62%/min(92vw,520px) auto no-repeat,
  radial-gradient(55% 32% at 0% 16%,rgba(96,180,248,.85),transparent 72%),
  radial-gradient(60% 30% at 100% 14%,rgba(222,52,44,.85),transparent 72%),
  radial-gradient(50% 26% at 62% 22%,rgba(110,48,120,.55),transparent 75%),
  radial-gradient(65% 30% at 40% 100%,rgba(60,165,85,.85),transparent 72%),
  radial-gradient(60% 34% at 100% 96%,rgba(62,136,234,.9),transparent 72%),
  radial-gradient(70% 40% at 0% 60%,rgba(14,32,80,.9),transparent 75%),
  linear-gradient(180deg,#183A85 0%,#1A3C8A 55%,#1D46A0 100%)}}
/* riquadri */
.card,.item,.empty,.tab-cl,.regole,.lista,.gioc{background:var(--card);border:1px solid var(--card-bd);box-shadow:var(--card-sh);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card,.empty,.regole,.lista{border-radius:20px}
.item{border-radius:16px}

/* schermi larghi: la foto del giocatore resta di misura normale sulla destra e sfuma verso sinistra */
@media (min-width:700px){
  .gioc.sf::after{-webkit-mask:var(--sf-m) right top/560px auto no-repeat,linear-gradient(to left,#000 380px,transparent 560px);-webkit-mask-composite:source-in;mask:var(--sf-m) right top/560px auto no-repeat intersect,linear-gradient(to left,#000 380px,transparent 560px)}}
@media (min-width:700px) and (prefers-color-scheme:dark){.con-tabs{--sf-base:#0D1A3E}.camp-l-app{--sf-base:#2A0F3F}
  .gioc.sf::before{background:linear-gradient(var(--velo),var(--velo)),linear-gradient(to left,transparent 380px,var(--sf-base) 560px),linear-gradient(transparent 700px,var(--sf-base) 840px),var(--sf-f) right top/560px auto no-repeat,var(--sf-base)}}
.empty{color:var(--muted);border-style:solid}
.empty h3{color:var(--fg)}
.item .ph{background:repeating-linear-gradient(135deg,var(--av1) 0 6px,var(--av2) 6px 12px);color:var(--avf)}
.field input,.field select,.field textarea{background:var(--card);border-color:var(--line)}
.btn-ghost{background:var(--chip);color:var(--fg)}
.cnt{background:var(--chip);color:var(--fg)}
/* schede: pillole come nell'app di riferimento */
.seg{background:none;padding:2px 16px 6px;margin:0 -16px;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border-radius:99px;padding:9px 14px;border:1.5px solid color-mix(in srgb,var(--royal) 35%,transparent);background:var(--card);color:var(--fg);font-weight:800;font-size:14px;line-height:1.15;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--royal);border-color:var(--royal);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--royal) 35%,transparent)}
.seg button[aria-pressed=true] .cnt{background:rgba(255,255,255,.25);color:#fff}.seg button[aria-pressed=true] .cnt.hot{background:#E5372B;color:#fff;box-shadow:0 0 0 1.5px #fff}
/* titoli di sezione */
.lbl{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--lbl);text-transform:uppercase;margin:0}
.ttl{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;margin:-10px 0 0;line-height:1}
.oro{color:var(--gold);display:flex;gap:8px;align-items:center}
.regole{font-size:13.5px;color:var(--muted);margin:0;padding:12px 14px 12px 30px}
.regole li+li{margin-top:4px}
/* classifica */
.tab-cl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border-radius:20px;overflow:hidden}
.tab-cl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);font-weight:800;padding:12px 4px;text-align:center;background:none}
.tab-cl td{padding:11px 4px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--muted)}
.tab-cl td.sq,.tab-cl th.sq{text-align:left;padding-left:8px;max-width:0;width:100%}
.tab-cl .sqc{display:flex;align-items:center;gap:8px;min-width:0}.tab-cl .sqc .stemma{margin:0}.tab-cl .sqc .nm{min-width:0;line-height:1.15;overflow-wrap:anywhere}
.tab-cl td.sq{font-weight:800;letter-spacing:.03em;color:var(--fg);text-transform:uppercase;font-size:13.5px}
.tab-cl td.pt{font-weight:800;color:var(--fg);font-size:16px;border-left:3px solid var(--royal)}
.tab-cl td.pos{width:30px;color:var(--muted);font-size:16px;padding-left:8px}
.stemma{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;color:#fff;font-family:var(--display);font-weight:800;font-size:12px;vertical-align:middle;margin-right:8px;box-shadow:0 2px 6px rgba(0,0,0,.15);flex:none}
/* barra in basso: stesso sfondo con lo stadio della barra in alto */
.con-tabs main.wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:22px 22px 0 0;
  background:linear-gradient(90deg,rgba(5,12,40,.55) 0%,rgba(5,12,40,.35) 100%),url(../sfondo-barra.jpg?v=2) 20% 62%/max(165%,640px) auto no-repeat,#0B1640;
  box-shadow:inset 0 4px 0 var(--riga,#22b8f0),0 -6px 20px rgba(10,20,60,.25);
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;border:0;background:none;color:#fff;font-size:12.5px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.5);cursor:pointer}
.tabbar svg{width:24px;height:24px;stroke-width:2.3}
.tabbar button[aria-current=page]{background:#fff;color:var(--acc);text-shadow:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.camp-f-app{--acc:#2E58CC;--riga:#22b8f0}.camp-l-app{--acc:#8E24AA;--riga:#c026d3}
@media (prefers-color-scheme:dark){.camp-f-app{--accbg:#3A6BEA}.camp-l-app{--accbg:#9C2BC4}
.tabbar button[aria-current=page]{background:var(--accbg);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.35)}}
/* testi appoggiati sullo sfondo */
main.wrap > .note,main.wrap > section > .note,main.wrap .eyebrow{color:var(--muted)}
@media (prefers-color-scheme:dark){main.wrap > .note,main.wrap > section > .note,main.wrap .eyebrow{color:#C3D0E6}}

/* partite (amministratore) */
.pst{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;align-self:flex-start;background:var(--chip);color:var(--muted)}
.pst.multi{border-radius:12px;padding:6px 10px;line-height:1.35;align-self:stretch;font-weight:700}
.pst.ok{background:rgba(30,138,79,.16);color:var(--ok)}.pst.wait{background:rgba(232,163,60,.18);color:var(--warn)}.pst.no{background:rgba(210,58,46,.14);color:var(--red)}
.item .stemma{width:40px;height:40px;border-radius:11px;font-size:15px;margin:0}
.item .tx .vsr{display:flex;align-items:center;gap:8px;min-width:0;font-size:inherit;color:var(--fg)}
.item .tx .vsr+.vsr{margin-top:5px}
.item .tx .vsr+span:not(.vsr){margin-top:6px}
.item .tx .vsr .stemma{width:30px;height:30px;border-radius:9px;font-size:14px;color:#fff;margin:0}
.item .tx .vsr i{font-style:normal;font-family:var(--display);font-size:22px;font-weight:800;min-width:28px;text-align:right;color:var(--fg)}
.item .tx .vsr.perde b,.item .tx .vsr.perde i{opacity:.55}
.item .tx .vsr b{flex:1;min-width:0;line-height:1.2;overflow-wrap:anywhere}
.sheet.stack > *{flex-shrink:0}
.ante{max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:14px;padding:12px;font-size:14px}
.ante div{display:flex;flex-direction:column;gap:2px}.ante b{font-family:var(--display);font-size:17px}

/* partite (pagina pubblica) */
.card.par{padding:0;overflow:hidden}
.par .m{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:16px 10px 14px;border-top:1px solid var(--line);text-align:center}
.par .m:first-child{border-top:0}
/* lo stemma è centrato con il risultato (o l'orario), il nome sotto */
.par .m .tm{padding-top:var(--tmp,35px)}.par .m:not(.fin) .tm{--tmp:28px}.par .m .sc .num,.par .m .sc .ora{margin-top:8px}
/* il risultato un filo più basso del centro degli stemmi (scelta B) */
.par .m .sc .num,.par .m .sc .ora{position:relative;top:6px}
.tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15;color:var(--fg);min-width:0;overflow-wrap:anywhere}

.st{font-size:11.5px;font-weight:800;letter-spacing:.04em;background:var(--chip);color:var(--muted);padding:3px 10px;border-radius:99px;white-space:nowrap}
.st.prox{background:color-mix(in srgb,var(--royal) 14%,transparent);color:var(--royal)}
.st.no{background:rgba(210,58,46,.14);color:var(--red)}
.num{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;color:var(--fg);white-space:nowrap}
.ora{font-family:var(--display);font-size:30px;font-weight:800;line-height:1;color:var(--ora);white-space:nowrap}
.ft{grid-column:1/-1;margin-top:16px;font-size:12.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.arb{grid-column:1/-1;margin-top:4px;font-size:13.5px;color:var(--fg)}
.mrc{grid-column:1/-1;display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;margin-top:10px;font-size:13px;color:var(--fg);align-items:start}
.mrc > div{display:flex;flex-direction:column;gap:2px}.mrc > div:first-child{text-align:right}.mrc > div:last-child{text-align:left}
.mrc i{font-style:normal;font-weight:800;color:var(--muted)}.mrc .pal{font-size:13px;opacity:.75;text-align:center}
.prm{grid-column:1/-1;margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px}.prm b{color:var(--fg);font-weight:700}
.gioc{border-radius:20px;overflow:hidden}
.gioc .gh,.gioc .gr{display:grid;grid-template-columns:30px 36px 1fr 52px;align-items:center;gap:8px;padding:10px 12px 10px 8px}
.gioc .gh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--fg);padding-top:12px;padding-bottom:8px}.gioc .gh span:first-child{grid-column:1/4;padding-left:4px}
.gioc .gr{border-top:1px solid var(--line)}
.gioc .pos{text-align:center;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.gioc .gr .stemma{width:34px;height:34px;border-radius:10px;font-size:13px;margin:0}
.gioc .gn{min-width:0;display:flex;flex-direction:column}
.gioc .gn b{font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.gioc .gn span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
.gioc .gv,.gioc .gh span:last-child{text-align:center}.gioc .gv{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.gioc .gr.p1 .pos{color:#D49A00;font-weight:800}
.gioc.dis .gr{grid-template-columns:36px 1fr auto}.gioc.dis .gh{grid-template-columns:1fr auto}.gioc.dis .gh span:first-child{grid-column:auto}
.gioc.car .gr,.gioc.car .gh{grid-template-columns:36px 1fr 38px 38px}.gioc.car .gh span:first-child{grid-column:1/3}
.gioc .gx{grid-column:2/-1;font-size:12.5px;color:var(--muted);margin-top:-4px}.gioc .gx b{color:var(--fg);font-weight:700}
.gioc .gg{text-align:center;min-width:64px}.gioc .gg b{display:block;font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.gioc .gg small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gioc .gg.att b{color:#E8A33C}.gioc .gg b.fd{font-size:16px}
.cy,.cr{display:inline-block;width:11px;height:15px;border-radius:2.5px;vertical-align:-2px;box-shadow:0 1px 2px rgba(0,0,0,.25)}.cy{background:#F5C518}.cr{background:#E5333A}
.gioc .gc{text-align:center;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}.gioc .gc.z{color:var(--muted);opacity:.5;font-weight:600}
.ckr{display:grid;grid-template-columns:1fr 40px;align-items:center;gap:4px 6px;font-size:14px}.ckr + .ckr{border-top:1px solid var(--line);padding-top:8px}.ckr > span{grid-column:1/-1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mkb .ckr select{min-height:38px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--card);color:var(--fg);font-size:14px;width:100%;min-width:0}
.ckr .x{height:38px}
.nw{white-space:nowrap}.sl{display:block}
.stemma.img{background:transparent !important;box-shadow:none;overflow:hidden}.stemma.img img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.tap{cursor:pointer}.tab-cl td.sq.tap:active,.tm.tap:active,.gr.tap:active,.pr.tap:active{opacity:.6}
.maglie{display:flex;gap:12px;margin-top:6px}.maglie span{display:flex;flex-direction:column;align-items:center;gap:2px}.maglie small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.maglia.vuota{color:var(--muted);opacity:.6}
.maglie small{white-space:nowrap}
.stemma.img.ol-l img{filter:drop-shadow(1px 0 0 #1b1f2a) drop-shadow(-1px 0 0 #1b1f2a) drop-shadow(0 1px 0 #1b1f2a) drop-shadow(0 -1px 0 #1b1f2a)}
@media (prefers-color-scheme:dark){.stemma.img.ol-l img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}.stemma.img.ol-d img{filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)}}
.stm-duo{display:flex;gap:6px;flex:none}.stm-duo .stm-prev{width:78px;height:78px;border-style:solid}
.stm-prev.chiaro{background:#EEF3FB}.stm-prev.scuro{background:#0D183A}.stm-prev:not(.scuro) .vuoto{color:#5B6577}.stm-prev.scuro .vuoto{color:#9fb0d0}
.stm-prev.chiaro.ol img{filter:drop-shadow(1px 0 0 #1b1f2a) drop-shadow(-1px 0 0 #1b1f2a) drop-shadow(0 1px 0 #1b1f2a) drop-shadow(0 -1px 0 #1b1f2a)}
.stm-prev.scuro.ol img{filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--fg)}.chk input{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--royal);border-color:var(--royal);color:#fff}
.sw.cust{position:relative;overflow:hidden;background:conic-gradient(#f33,#fd3,#3d5,#3cf,#36f,#c3f,#f33);display:inline-block}
.sw.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.sheet-bg.sopra{z-index:60}
.seg .sh{display:none}@media (max-width:380px){.seg .lg{display:none}.seg .sh{display:inline}}
.tbtn{gap:6px;flex-wrap:nowrap}.tbtn .btn{flex:1 1 auto;white-space:nowrap;padding-left:8px;padding-right:8px}
.avv{color:#B5650B !important;font-weight:700}
.tstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tstat div{background:var(--chip,var(--surface-2));border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}.tstat b{font-family:var(--display);font-size:22px;line-height:1}.tstat span{font-size:11.5px;color:var(--muted);line-height:1.15}
#t-cognome,#t-nome{text-transform:uppercase}
.cal-sum ul{margin:4px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:2px}.cal-sum p{margin:6px 0}.cal-ante span i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tgr{gap:8px}.tgr[hidden]{display:none}.tgr-h{display:flex;align-items:center;gap:10px;padding:6px 2px 0;min-width:0}.tgr-h .stemma{width:30px;height:30px;font-size:11px;border-radius:8px;margin:0;flex:none}.tgr-h b{font-family:var(--display);font-size:17px;letter-spacing:.03em;text-transform:uppercase;min-width:0;overflow-wrap:normal}.tgr-h .cnt{flex:none}.tgr-h .tgr-c{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.imp-l{display:flex;flex-direction:column;gap:6px}.imp-n{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.imp-n .nm b{font-weight:800}.imp-n .nm{font-weight:500}.imp-sw{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;min-width:34px;height:28px;font-size:15px;line-height:1;cursor:pointer;padding:0 8px}.imp-av{background:color-mix(in srgb,#E8A33C 16%,transparent);border-radius:10px;padding:8px 10px}.imp-r{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--chip,var(--surface-2));cursor:pointer}.imp-r input{margin-top:3px;width:20px;height:20px;flex:none}.imp-r .tx{display:flex;flex-direction:column;gap:2px;min-width:0}.imp-r .tx>span{font-size:13px;color:var(--muted)}.imp-r .pst{align-self:flex-start}.imp-r.dis{opacity:.55}
.rhead{display:flex;align-items:center;gap:10px;min-width:0}.rhead>b{flex:1;min-width:0}.rhead .stemma{width:36px;height:36px;border-radius:10px;margin:0}
.rp{display:flex;align-items:center;gap:8px}.rp .rtx{flex:1}.rtx{display:flex;flex-direction:column;min-width:0;gap:1px}.rtx span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rper{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--line, rgba(127,127,127,.2))}.rcard .rper:first-of-type{border-top:0;padding-top:0}
.ctt{gap:6px;flex-wrap:nowrap}.ctt .btn{flex:1 1 0;justify-content:center;text-decoration:none;white-space:nowrap;padding-left:8px;padding-right:8px}.ctt .btn.em{flex:0 0 46px}
.btn-wa{background:#1FA855;color:#fff;border:0}
.sqsw button{display:inline-flex;align-items:center;gap:6px}.sqsw .stemma{width:22px;height:22px;border-radius:6px;font-size:10px;margin:0}
.btn.scelta{display:flex;flex-direction:column;align-items:center;gap:2px;height:auto;min-height:52px;padding:10px 14px;white-space:normal;text-align:center}.btn.scelta small{font-weight:500;font-size:12.5px;opacity:.85}
.warn-campo{background:rgba(232,163,60,.14);border:1px solid rgba(232,163,60,.45);border-radius:12px;padding:8px 10px;color:var(--fg)}
.mg-row{align-items:flex-start}
@media (prefers-color-scheme:dark){.maglia path:last-child{stroke:rgba(255,255,255,.6)}}
.stm-row,.mg-row{display:flex;gap:14px;align-items:center}
.stm-prev{width:96px;height:96px;border-radius:18px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;background:var(--chip)}
.stm-prev img{width:100%;height:100%;object-fit:contain}.stm-prev .vuoto{font-size:12px;color:var(--muted);text-align:center;padding:6px}
.mg-prev{flex:none;width:64px;display:flex;justify-content:center}.mini{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pal{display:flex;flex-wrap:wrap;gap:6px}.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.18);cursor:pointer;padding:0}.sw.on{outline:3px solid var(--royal);outline-offset:2px;border-color:#fff}
.sqbox{display:flex;align-items:center;gap:12px;padding:12px}.sqbox .sqst .stemma{width:56px;height:56px;font-size:20px;border-radius:14px;margin:0}.sqbox .sqtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.sqbox .maglie{margin-top:0}
.indietro-sq{align-self:flex-start;border:0;background:var(--card);color:var(--fg);font-weight:700;border-radius:99px;padding:8px 14px;cursor:pointer;box-shadow:var(--card-sh)}
.sqhead{container-type:inline-size;padding:16px}
/* squadra: stemma, nome, maglie e numeri nella stessa scheda; su schermi larghi i numeri vanno a destra */
.sqhead .sqtop{display:flex;gap:14px;align-items:center;min-width:0}
.sqhead .sqnum{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* distinte non ancora inviate nella giornata, con i contatti dei responsabili */
function distMancanti(cat){
  if(!S.loaded.partite || !S.loaded.dist || !S.pubParOk) return '<div class="status"><span class="spin"></span>Carico…</div>';
  const l = parDi(S.partite, cat), giorn = giornateDi(l);

  S.dgio = S.dgio || {}; let g = S.dgio[cat]; if(!giorn.includes(g)) g = S.dgio[cat] = gioDefault(l, giorn);
  const lg = l.filter(p => +p.giornata === g).sort(ordPar), pronte = lg.filter(p => !esito(p) && p.stato !== 'rinviata' && p.data && p.ora);
  const righe = []; let ok = 0;
  pronte.forEach(p => [[p.casaId, p.casa], [p.ospiteId, p.ospite]].forEach(([id, nome]) => { const [k, t] = statoDist(p, id); if(k === 'ok') ok++; else righe.push({p, id, nome, k, t}); }));
  const giocate = lg.filter(p => esito(p)).length, senza = lg.length - pronte.length - giocate;
  const link = location.origin + location.pathname + '#area';
  const it = ({p, id, nome, k, t}) => { const rs = respSq(id), quando = `${giornoCorto(p.data)} ore ${p.ora}`;
    return `<li class="card stack" style="gap:8px"><div class="rhead">${stemma(nome)}<div class="rtx"><b>${esc(nome)}</b><span><span class="nw">${esc(p.casa)}</span> – <span class="nw">${esc(p.ospite)}</span></span><span>${esc(quando + (p.impianto ? ' · ' + p.impianto : ''))}</span></div></div><span class="pst ${k}">${esc(t)}</span>

        : `<p class="note">Nessun responsabile per questa squadra.</p><button class="btn btn-ghost sm" data-radd="${esc(id)}">+ Aggiungi responsabile</button>`}</li>`; };
  return `<div class="seg gior" role="tablist" aria-label="Giornate">${giorn.map(n => `<button data-dg="${n}" aria-pressed="${n === g}">${n}ª giornata</button>`).join('')}</div>
    <p class="note">${pronte.length ? `Distinte inviate: <b>${ok} su ${pronte.length * 2}</b>.` : 'Nessuna partita di questa giornata ha ancora data e ora.'}${senza ? ` ${senza === 1 ? '1 partita' : senza + ' partite'} senza data, ora o rinviate: la distinta si compila quando c’è la data.` : ''}${giocate ? ` ${giocate === 1 ? '1 partita già giocata' : giocate + ' partite già giocate'}.` : ''}</p>
    ${righe.length ? `<ul class="list">${righe.map(it).join('')}</ul>` : pronte.length ? '<div class="empty"><h3>Tutte arrivate ✓</h3><span>Tutte le squadre di questa giornata hanno inviato la distinta.</span></div>' : ''}`;
}

function openInvito(q){
  if(!q || !q.id) return;
  if(postiSq(q.id) >= MAXRESP){ alert(`${q.nome} ha già ${MAXRESP} responsabili.`); return; }
  const {root, close} = sheet(`<form class="form" id="iForm"><h3 style="grid-column:1/-1">Nuovo responsabile</h3><p class="note" style="grid-column:1/-1">${stemma(q.nome)}<b>${esc(q.nome)}</b></p>

    <div class="field"><label for="i-nome">Nome</label><input id="i-nome" required></div><div class="field"><label for="i-cog">Cognome</label><input id="i-cog" required></div>
    <div class="field full"><label for="i-tel">Telefono (cellulare)</label><input id="i-tel" type="tel" inputmode="tel"></div>
    <p class="note" style="grid-column:1/-1">Se ha già un account nell’area squadre viene abilitato subito. Altrimenti, quando si registra con questa email (e la conferma), entra direttamente nella squadra senza chiedere niente.</p>
    <div class="err" id="iErr" role="alert" style="grid-column:1/-1"></div>
    <div class="actions"><button class="btn btn-primary" id="iGo">Aggiungi</button><button type="button" class="btn btn-ghost" data-x>Annulla</button></div></form>`, 'Nuovo responsabile');
  root.querySelector('#iForm').onsubmit = async e => { e.preventDefault(); const v = id => root.querySelector('#' + id).value.trim(), er = root.querySelector('#iErr'), bt = root.querySelector('#iGo');
    const em = v('i-em').toLowerCase(), d = {nome: v('i-nome'), cognome: v('i-cog'), telefono: v('i-tel')};
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ er.textContent = 'Controlla l’email'; return; }
    if(postiSq(q.id) >= MAXRESP){ er.textContent = `${q.nome} ha già ${MAXRESP} responsabili`; return; }
    const p = S.resps.find(x => String(x.email || '').toLowerCase() === em);
    bt.disabled = true;
    try{
      if(p){
        if(S.abil.some(a => a.uid === p.id && a.squadraId === q.id && a.stato === 'attivo')){ er.textContent = 'È già responsabile di questa squadra'; bt.disabled = false; return; }
        const b = db().batch();
        b.set(db().collection('abilitazioni').doc(p.id + '_' + q.id), {uid: p.id, squadraId: q.id, squadra: q.nome || '', categoria: q.categoria || '', stato: 'attivo', motivo: '', createdAt: Date.now(), abilitatoAt: Date.now(), via: 'admin'});
        const manca = {}; ['nome', 'cognome', 'telefono'].forEach(k => { if(!p[k] && d[k]) manca[k] = d[k]; }); if(Object.keys(manca).length) b.update(db().collection('responsabili').doc(p.id), manca);
        await b.commit(); toast(`${nomeR(p)} ha già un account: l’ho abilitato subito`);
      } else {
        if(S.inviti.some(i => i.id === em + '_' + q.id)){ er.textContent = 'Questa email è già invitata per la squadra'; bt.disabled = false; return; }
        await db().collection('inviti').doc(em + '_' + q.id).set({email: em, squadraId: q.id, squadra: q.nome || '', categoria: q.categoria || '', ...d, createdAt: Date.now(), by: S.user.uid});
        toast('Fatto: quando si registra con questa email entra direttamente nella squadra');

      close();
    }catch(err){ bt.disabled = false; er.textContent = fbErr(err); }
  };
}

const stagioneDi = (d = new Date()) => { const a = d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; return `${a}/${String((a + 1) % 100).padStart(2, '0')}`; };
const STAG = stagioneDi();
const NOMECAMP = {'C5 AICS': 'Futsal League', 'C7 AICS': 'R.E. Liga'};
const GIORNI = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const GG = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const dataObj = iso => { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, m - 1, d); };
const giornoCorto = iso => iso ? `${GG[dataObj(iso).getDay()]} ${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const tariffa = c => /7/.test(c) ? 30 : 25;
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const ordPar = (a, b) => (a.data || '9999') .localeCompare(b.data || '9999') || (a.ora || '').localeCompare(b.ora || '') || (a.casa || '').localeCompare(b.casa || '');
const parDi = (l, cat) => l.filter(p => p.camp === cat && (p.stagione || STAG) === STAG);
const giornateDi = l => [...new Set(l.map(p => +p.giornata || 0))].sort((a, b) => a - b);
const desDi = p => p.desId ? S.des.find(d => d.id === p.desId) : null;
const refFatto = d => d && Object.values(d.referti || {}).some(r => r && !r.sbloccato);
/* stato della partita per l'amministratore */
function statoPar(p){
  const d = desDi(p), e = esito(p);
  if(refNuovo(p)) return ['wait', 'Referto da confermare'];
  if(e && e.tav) return ['ok', `A tavolino ${e.gc}-${e.go}${e.rit ? ' (ritiro)' : ''}`];
  if(e) return ['ok', `Finale ${e.gc}-${e.go}`];
  if(p.rigiocare) return ['wait', p.data ? 'Da rigiocare: tocca Salva per la designazione' : 'Da rigiocare: metti la nuova data'];
  if(refFatto(d) && p.stato !== 'rinviata') return ['ok', 'Referto arrivato'];
  if(p.stato === 'rinviata') return ['no', 'Rinviata'];
  if(!p.data) return ['grigio', 'Da programmare'];
  if(!p.desId) return ['wait', p.ora && p.impianto ? 'Non è nell’app arbitri: tocca Salva' : 'Manca ora o campo'];
  if(!d) return ['wait', 'In app arbitri'];
  if(d.annullata && !(d.ufficiali || []).length) return ['no', 'Da riprogrammare'];
  const u = (d.ufficiali || [])[0];
  if(!u) return ['wait', 'Da designare'];
  const r = (d.risposte || {})[u.uid];
  return r && r.stato === 'accettata' ? ['ok', 'Arbitro: ' + (u.nome || '')] : ['wait', 'Arbitro: ' + (u.nome || '') + ' · in attesa'];
}
/* giornata da mostrare all'apertura: la prima con partite non ancora giocate */
const gioDefault = (l, giorn) => { const oggi = oggi_(); const g = giorn.find(n => l.some(p => +p.giornata === n && !p.giocata && (!p.data || p.data >= oggi))); return g != null ? g : giorn[giorn.length - 1]; };
const oggi_ = () => oggi();

  const cat = S.pcat, l = parDi(S.partite, cat), giorn = giornateDi(l);
  const seg = `<div class="seg" role="group" aria-label="Campionato">${CATS.map(c => `<button data-pc="${c}" aria-pressed="${c === cat}">${NOMECAMP[c]} <span class="cnt">${parDi(S.partite, c).length}</span></button>`).join('')}</div>`;
  if(!S.loaded.partite || !S.loaded.des) return seg + '<div class="status"><span class="spin"></span>Carico…</div>';
  if(!l.length) return seg + `<div class="empty"><h3>Nessun calendario ${esc(NOMECAMP[cat])}</h3><span>Stagione ${STAG}. Crea il calendario in uno di questi modi: poi, mese per mese, aggiungi data, ora e campo di ogni partita.</span></div>
    <div class="stack" style="gap:10px"><button class="btn btn-primary btn-block" data-cal="file">📄 Importa da file (Excel o CSV)</button><button class="btn btn-ghost btn-block" data-cal="gen">⚙️ Generalo in automatico</button><button class="btn btn-ghost btn-block" data-cal="mano">✍️ Inseriscilo a mano</button></div>`;

    <div class="seg gior" role="tablist" aria-label="Giornate">${giorn.map(n => `<button data-pg="${n}" aria-pressed="${n === g}">${n}ª giornata</button>`).join('')}</div>
    <ul class="list">${lg.map(p => { const [k, t] = statoPar(p); return `<li><button class="item" data-par="${esc(p.id)}"><span class="tx">${righeSq(p)}<span>${p.data ? esc(giornoCorto(p.data) + (p.ora ? ' · ' + p.ora : '') + (p.impianto ? ' · ' + p.impianto : '')) : 'Data da definire'}</span>${t.startsWith('Finale') ? '' : `<span class="pst ${k}">${esc(t)}</span>`}</span></button></li>`; }).join('')}</ul>`;
}

const sheet = (html, label, cls = '') => { const root = $('#sheetRoot'); root.innerHTML = `<div class="sheet-bg"><div class="sheet stack${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab"></div>${html}</div></div>`;

/* scelta dei file in un modulo: tiene quelli già caricati e i nuovi da caricare */

/* --- generatore all'italiana (metodo del cerchio) --- */
function generaRR(teams, ritorno){
  const t = teams.slice(); if(t.length % 2) t.push(null);
  const n = t.length, out = [];
  for(let r = 0; r < n - 1; r++){
    for(let i = 0; i < n / 2; i++){
      let a = t[i], b = t[n - 1 - i];
      if(i === 0 ? r % 2 === 1 : i % 2 === 1) [a, b] = [b, a];
      if(a && b) out.push({giornata: r + 1, c: a, o: b});
    }
    t.splice(1, 0, t.pop());
  }
  if(ritorno) out.slice().forEach(m => out.push({giornata: m.giornata + n - 1, c: m.o, o: m.c}));
  return out;
}

/* ---------- importa il calendario ----------

    R[i].r.forEach((c, j) => { const t = txt(c).toLowerCase(); if(!t || t.length > 40) return; const k = CALK.find(([k, re]) => re.test(t) && (k === 'ris' || !(k in m))); if(!k) return; if(k[0] === 'ris') m.ris.push(j); else m[k[0]] = j; });

function assegnaGiornate(l){

}

      const pres = new Set(lm.map(([x]) => x.id));

/* salva la partita e tiene allineata la designazione nell'app arbitri */
async function salvaPartita(n, old, im){
  const col = db().collection('partite'), ref = n.id ? col.doc(n.id) : col.doc(), d = desDi(old || {}), now = Date.now();
  const {id, ...dati} = n, ops = [];
  const pronta = n.data && n.ora && n.impianto && n.stato !== 'rinviata';
  const geo = im && im.lat && im.lng ? {lat: +im.lat, lng: +im.lng} : {lat: null, lng: null};
  const info = {data: n.data, ora: n.ora, categoria: n.camp, casa: n.casa, ospite: n.ospite, impianto: n.impianto, indirizzo: n.indirizzo, citta: n.citta, mapsUrl: im ? im.mapsUrl || '' : '', ...geo};
  const nuovaDes = d && old && (old.stato === 'rinviata' || old.rigiocare) && n.stato !== 'rinviata' && refFatto(d);
  if((!d || nuovaDes) && pronta){
    const dref = db().collection('designazioni').doc();
    ops.push(b => b.set(dref, {...info, girone: '', numeroGara: '', rimborso: tariffa(n.camp), note: '', ufficiali: [], arbitriIds: [], cronologia: [], risposte: {}, referti: {}, avvisi: {}, inviate: {}, sostituzioni: {}, subentri: {}, sostituiti: [], storico: [], partitaId: ref.id, giornata: n.giornata, createdAt: now, updatedAt: now}));
    dati.desId = dref.id; dati.rigiocare = false;
  } else if(d && !refFatto(d)){
    const CAMPI = ['data', 'ora', 'casa', 'ospite', 'impianto'], ug = (a, b) => String(a || '') === String(b || '');
    if(n.stato === 'rinviata' && !d.annullata){
      const nomi = (d.ufficiali || []).map(u => u.nome).filter(Boolean);
      ops.push(b => b.update(db().collection('designazioni').doc(d.id), {ufficiali: [], arbitriIds: [], risposte: {}, referti: {}, avvisi: {}, inviate: {}, sostituzioni: {}, subentri: {}, sostituiti: [], modifiche: null,
        annullata: {at: now, motivo: 'Partita rinviata', arbitri: nomi}, cronologia: [...(d.cronologia || []), {at: now, annullata: true, motivo: 'Partita rinviata', voci: nomi.length ? [{k: 'arbitri', da: nomi.join(', '), a: ''}] : []}], updatedAt: now}));
    } else if(n.stato !== 'rinviata'){
      const camb = CAMPI.filter(k => !ug(d[k], info[k]));
      if(camb.length && n.data){
        const upd = {...info, giornata: n.giornata, updatedAt: now, risposte: {}, avvisi: {}, inviate: {}, cronologia: [...(d.cronologia || []), {at: now, voci: camb.map(k => ({k: k === 'casa' || k === 'ospite' ? 'squadre' : k, da: k === 'casa' || k === 'ospite' ? `${d.casa} – ${d.ospite}` : d[k] || '', a: k === 'casa' || k === 'ospite' ? `${n.casa} – ${n.ospite}` : info[k]}))
          .filter((x, i, a) => a.findIndex(y => y.k === x.k) === i)}]};
        if(d.annullata) Object.assign(upd, {annullata: firebase.firestore.FieldValue.delete(), modifiche: null});
        else upd.modifiche = {at: now, campi: camb, prima: Object.fromEntries(CAMPI.map(k => [k, d[k] || ''])), per: d.arbitriIds || []};
        ops.push(b => b.update(db().collection('designazioni').doc(d.id), upd));
      }
    }
  }
  if(n.stato !== 'rinviata' && old && old.stato === 'rinviata' && !n.data){ const e = new Error('data'); e.msg = 'Per togliere “rinviata” metti la nuova data.'; throw e; }
  if(n.stato === 'rinviata' && !(old && old.stato === 'rinviata')) dati.rinvii = (+((old || {}).rinvii) || 0) + 1;
  ops.unshift(b => b.set(ref, dati, {merge: true}));
  await scriviTutto(ops);
}

/* risultato che conta in classifica (null = non ancora giocata) */
function esito(p, imp = impDi(p.camp)){
  const rit = imp.ritirate || [], rc = rit.includes(p.casaId), ro = rit.includes(p.ospiteId), tv = imp.tav || [6, 0];
  let w = rc !== ro ? (rc ? 'ospite' : 'casa') : p.tavolino || '';
  if(rc && ro) return null;
  if(w) return {gc: w === 'casa' ? tv[0] : tv[1], go: w === 'casa' ? tv[1] : tv[0], tav: true, rit: rc !== ro};
  if(p.giocata && p.gc != null && p.go != null && p.gc !== '' && p.go !== '') return {gc: +p.gc, go: +p.go};
  return null;
}
function classifica(cat, squadre, partite){
  const imp = impDi(cat), rows = new Map(), rit = imp.ritirate || [];
  const riga = (id, nome) => { if(!rows.has(id)) rows.set(id, {id, nome, G: 0, V: 0, N: 0, P: 0, GF: 0, GS: 0, Pt: 0, cart: 0, rit: rit.includes(id)}); return rows.get(id); };
  squadre.forEach(q => riga(q.id, q.nome));
  const giocate = [];
  parDi(partite, cat).forEach(p => { const e = esito(p, imp); if(!e) return; const c = riga(p.casaId || p.casa, p.casa), o = riga(p.ospiteId || p.ospite, p.ospite);
    giocate.push({c: c.id, o: o.id, gc: e.gc, go: e.go});
    [[c, e.gc, e.go], [o, e.go, e.gc]].forEach(([r, f, a]) => { r.G++; r.GF += f; r.GS += a; if(f > a){ r.V++; r.Pt += 3; } else if(f === a){ r.N++; r.Pt += 1; } else r.P++; });
    c.cart += cartDi(p, 'casa'); o.cart += cartDi(p, 'ospite'); });
  penDi(cat).forEach(x => { const r = rows.get(x.sqId); if(r){ r.Pt -= +x.punti || 0; r.pen = (r.pen || 0) + (+x.punti || 0); } });
  const l = [...rows.values()], dr = r => r.GF - r.GS;
  const base = (a, b) => dr(b) - dr(a) || b.GF - a.GF || a.cart - b.cart || (a.nome || '').localeCompare(b.nome || '', 'it');
  // a pari punti: prima gli scontri diretti tra le squadre appaiate
  const per = new Map(); l.filter(r => !r.rit).forEach(r => { if(!per.has(r.Pt)) per.set(r.Pt, []); per.get(r.Pt).push(r); });
  const out = [];
  [...per.keys()].sort((a, b) => b - a).forEach(pt => { const g = per.get(pt);
    if(g.length > 1){ const ids = new Set(g.map(r => r.id)), mp = new Map(g.map(r => [r.id, 0]));
      giocate.filter(x => ids.has(x.c) && ids.has(x.o)).forEach(x => { if(x.gc > x.go) mp.set(x.c, mp.get(x.c) + 3); else if(x.gc < x.go) mp.set(x.o, mp.get(x.o) + 3); else { mp.set(x.c, mp.get(x.c) + 1); mp.set(x.o, mp.get(x.o) + 1); } });
      g.sort((a, b) => mp.get(b.id) - mp.get(a.id) || base(a, b)); }
    out.push(...g); });
  out.push(...l.filter(r => r.rit).sort(base));
  return {righe: out, giocate: giocate.length, imp};
}

/* WhatsApp 4:5: la storia intera, rimpicciolita senza spostare nulla, su sfondo sfocato (in chat WhatsApp taglia le immagini più lunghe) */
function shChat(st){
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const k = W / st.width; ctx.save(); ctx.filter = 'blur(28px) brightness(.55)'; ctx.drawImage(st, -40, (H - st.height * k) / 2 - 40, W + 80, st.height * k + 80); ctx.restore();
  ctx.fillStyle = 'rgba(4,9,30,.35)'; ctx.fillRect(0, 0, W, H);
  const h = H - 40, w = st.width * h / st.height, x = (W - w) / 2;

}

    <div class="field full"><label for="nw-x">Testo</label><textarea id="nw-x" rows="8" maxlength="10000" placeholder="Scrivi la news…">${esc(n.testo || '')}</textarea></div>
    <div class="field full"><label>Video e link (YouTube, Instagram, siti…)</label><div id="nwLk" class="stack" style="gap:8px"></div></div>
    <div class="field full"><label>Galleria di foto e PDF (fino a 5 MB l’uno)</label><div class="alls" id="nwAl"></div></div>
    <div class="err" id="nwErr" role="alert" style="grid-column:1/-1"></div>
    <div class="actions"><button class="btn btn-primary" id="nwGo">${nuova ? 'Pubblica' : 'Salva'}</button><button type="button" class="btn btn-ghost" data-x>Annulla</button></div></form>`, 'News', 'largo');
  const $f = q => root.querySelector(q);
  const drawCov = () => { $f('#nwCov').innerHTML = (cover ? `<img src="${cover}" alt="Copertina"><button type="button" class="btn btn-ghost sm" id="nwCx">Togli la copertina</button>` : '')
      + `<label class="btn btn-ghost sm" for="nwCf">🖼️ ${cover ? 'Cambia' : 'Scegli'} la foto</label><input id="nwCf" type="file" accept="image/*" hidden>`;
    if($f('#nwCx')) $f('#nwCx').onclick = () => { cover = ''; drawCov(); };
    $f('#nwCf').onchange = async e => { const f = e.target.files[0]; if(!f) return; try{ cover = await coverDa(f); drawCov(); }catch(err){ toast('Non riesco a usare questa foto'); } }; };
  const leggiLk = () => root.querySelectorAll('[data-lk]').forEach(r => { const i = +r.dataset.lk; links[i] = {u: r.querySelector('[data-lu]').value.trim(), t: r.querySelector('[data-lt]').value.trim()}; });
  const drawLk = () => { $f('#nwLk').innerHTML = links.map((l, i) => `<div class="nw-lkr" data-lk="${i}"><input data-lu type="url" inputmode="url" placeholder="https://…" value="${esc(l.u || '')}" aria-label="Indirizzo del link"><input data-lt placeholder="Testo del tasto (facoltativo)" value="${esc(l.t || '')}" aria-label="Testo del tasto"><button type="button" class="x" data-lx="${i}" aria-label="Togli il link">✕</button></div>`).join('')
      + '<button type="button" class="btn btn-ghost sm" id="nwLa">+ Aggiungi video o link</button>';
    root.querySelectorAll('[data-lx]').forEach(b => b.onclick = () => { leggiLk(); links.splice(+b.dataset.lx, 1); drawLk(); });
    $f('#nwLa').onclick = () => { leggiLk(); links.push({u: '', t: ''}); drawLk(); root.querySelectorAll('[data-lu]')[links.length - 1].focus(); }; };
  drawCov(); drawLk();
  const fp = filePick(root, 'nwAl', n.allegati);
  $f('#nwF').onsubmit = async e => { e.preventDefault(); leggiLk(); const v = id => $f('#' + id).value.trim(), er = $f('#nwErr'), bt = $f('#nwGo'); er.textContent = '';
    if(!v('nw-t')){ er.textContent = 'Scrivi il titolo.'; return; }
    const lk = links.filter(l => l.u); if(lk.some(l => !okUrl(l.u))){ er.textContent = 'Un link non è valido: deve iniziare con https://'; return; }
    bt.disabled = true;
    try{ const nu = await caricaNuovi(fp, n.pubblicato !== false, bt); bt.textContent = 'Pubblico…';
      const o = {tipo: 'news', camp: v('nw-c'), data: v('nw-d') || oggi(), titolo: v('nw-t'), testo: v('nw-x'), cover, link: lk, allegati: [...fp.l, ...nu], stagione: STAG, updatedAt: Date.now()};
      if(nuova) await db().collection('comunicati').add({...o, pubblicato: true, pubAt: Date.now(), createdAt: Date.now(), by: S.user.uid}); else await db().collection('comunicati').doc(n.id).update(o);
      if(n.pubblicato !== false) await pubAll(fp.l, true); for(const a of fp.via) await togliAll(a);
      toast(nuova ? 'News pubblicata' : 'News aggiornata'); close(); }
    catch(err){ console.warn(err); bt.disabled = false; bt.textContent = nuova ? 'Pubblica' : 'Salva'; er.textContent = errFile(err); } };
}
function adminNews(){
  if(!S.loaded.comAll) return '<div class="status"><span class="spin"></span>Carico…</div>';
  const l = (S.comAll || []).filter(isNews).sort(comOrd);
  return `<button class="btn btn-primary btn-block" id="nNew">+ Nuova news</button>
    ${l.length ? `<ul class="list nw-list">${l.map(n => cardNews(n, 'data-nadm')).join('')}</ul>` : vuoto('Nessuna news', 'Le news compaiono nella scheda News di ogni campionato e, appena pubblicate, in un avviso nella pagina iniziale.')}`;
}
/* pagina iniziale: la news nuova compare in un pop-up che porta alla scheda News del campionato */
const popVisti = () => { try{ return JSON.parse(localStorage.getItem('aics-nwpop') || '{}'); }catch(e){ return {}; } };
const segnaPop = id => { try{ const v = popVisti(); v[id] = 1; localStorage.setItem('aics-nwpop', JSON.stringify(v)); }catch(e){} };
function popNews(){
  if(S.nwPopFatto || !S.pubComOk || VIEW() !== 'home' || $('#sheetRoot .sheet')) return;
  const n = (S.pubCom || []).filter(c => isNews(c) && nuovoC(c) && !popVisti()[c.id]).sort(comOrd)[0]; S.nwPopFatto = true; if(!n) return;
  segnaPop(n.id);
  const vai = v => { S.ptab = 'news'; S.sqp = ''; S.dlApri = {t: 'n', id: n.id, v}; location.hash = '#' + v; };
  const dove = n.camp ? [Object.keys(CAMP).find(k => CAMP[k].cat === n.camp) || 'futsal'] : ['futsal', 'liga'];
  const {root, close} = sheet(`<div class="stack nw-pop">${okImg(n.cover) ? `<img class="nw-cover" src="${n.cover}" alt="">` : ''}
    <p class="note" style="margin:0"><span class="pst wait">News</span> ${esc(n.camp ? NOMECAMP[n.camp] : 'Tutti i campionati')} · ${esc(fmt(n.data))}</p>
    <h3>${esc(n.titolo || 'News')}</h3>${n.testo ? `<p class="note" style="margin:0">${esc(estratto(n.testo, 180))}</p>` : ''}
    ${dove.map(v => `<button class="btn btn-primary btn-block" data-nv="${v}">Leggi la news${dove.length > 1 ? ' · ' + esc(CAMP[v].nome) : ''}</button>`).join('')}
    <button class="btn btn-ghost btn-block" data-x>Più tardi</button></div>`, 'News', '');
  root.querySelectorAll('[data-nv]').forEach(b => b.onclick = () => { close(); vai(b.dataset.nv); });
}
/* immagine da condividere: copertina, titolo e inizio del testo */
async function shNews(n, fmtI){
  const B = await shBase(n.camp || '', fmtI, 'NEWS', fmt(n.data)), {ctx, W, story} = B;
  let y = B.y0 + (story ? 10 : 0);
  if(okImg(n.cover)){ const im = await shImg(n.cover); if(im){ const cw = W - 100, ch = story ? 540 : 300, k = Math.max(cw / im.width, ch / im.height), w = im.width * k, h = im.height * k;
    ctx.save(); shRR(ctx, 50, y, cw, ch, 18); ctx.clip(); ctx.drawImage(im, 50 + (cw - w) / 2, y + (ch - h) / 2, w, h); ctx.restore();
    ctx.strokeStyle = 'rgba(140,180,255,.6)'; ctx.lineWidth = 3; shRR(ctx, 51, y + 1, cw - 2, ch - 2, 18); ctx.stroke(); y += ch + (story ? 30 : 16); } }
  const fs = story ? 32 : 24, lh = fs * 1.4, fine = B.y1 - (story ? 70 : 46);
  ctx.font = SHF.D(800, story ? 60 : 44); const tl = shWrap(ctx, (n.titolo || '').toUpperCase(), W - 160).slice(0, 3);
  ctx.font = SHF.B(500, fs); const all = shWrap(ctx, n.testo || '', W - 160), th = (story ? 66 : 50) * tl.length;
  const maxL = Math.max(0, Math.floor((fine - y - th - (story ? 70 : 46)) / lh)), vis = all.slice(0, maxL), hp = th + vis.length * lh + (story ? 64 : 44);
  shBar(ctx, 50, y, W - 100, Math.min(hp, fine - y)); let yy = y + (story ? 66 : 50);
  tl.forEach(t => { shTxt(ctx, t, 80, yy, W - 160, 'D', 800, story ? 60 : 44, '#fff'); yy += story ? 66 : 50; }); yy += lh * .1;
  vis.forEach((t, i) => { shTxt(ctx, i === vis.length - 1 && vis.length < all.length ? t + ' …' : t, 80, yy, W - 160, 'B', 500, fs, '#E6ECFF'); yy += lh; });
  shTxt(ctx, 'Leggi la news completa nell’app', W / 2, B.y1 - 6, W - 140, 'B', 700, story ? 30 : 23, B.acc, 'center');
  return B.cv;
}

if(!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey)){ $('#app').innerHTML = '<div id="gate"><div class="in"><h1>Manca ../firebase-config.js</h1></div></div>'; return; }
addEventListener('hashchange', vista);
addEventListener('resize', () => { if($('#home')) lay(); });
render();
loadFB().then(fb => fb.auth().onAuthStateChanged(u => onUser(u))).catch(() => { S.netErr = true; render(); });
})();

<script>
/* finestre: o la X in alto a destra (se ci sono altri tasti) o il tasto Chiudi fisso in fondo; Esc chiude (PC) */
(() => {
  const chiudi = bg => {
    if(!bg) return;
    if(bg.onclick){ bg.click(); return; }
    const b = [...bg.querySelectorAll('button')].reverse().find(x => x.matches('[data-x],[data-k=""]') || /^\s*(Chiudi|Annulla)\s*$/i.test(x.textContent));
    if(b) b.click(); else bg.remove();
  };
  const X = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const fondo = el => { for(let e = el; e; e = e.parentElement){ const c = getComputedStyle(e).backgroundColor; if(c && c !== 'transparent' && !/rgba\(.*,\s*0\)$/.test(c)) return c; if(e.classList.contains('sheet')) break; } return ''; };
  const allinea = (sh, xr) => requestAnimationFrame(() => {
    if(!xr.isConnected || xr.dataset.ok) return; xr.dataset.ok = '1';
    const h = sh.querySelector('h2, h3'); if(!h) return;
    const a = xr.getBoundingClientRect(), b = h.getBoundingClientRect();
    if(b.top - a.bottom > 44 || b.width < 120) return;
    xr.classList.add('in-riga'); h.classList.add('spazio-x');
    xr.style.marginBottom = '-' + (parseFloat(getComputedStyle(sh).rowGap) || 0) + 'px';
    requestAnimationFrame(() => {
      const r = xr.getBoundingClientRect(), hb = h.getBoundingClientRect(), lh = Math.min(hb.height, parseFloat(getComputedStyle(h).lineHeight) || hb.height);
      const btn = xr.firstChild; btn.style.top = Math.round(hb.top - r.top + (lh - 36) / 2) + 'px';
    });
  });
  const prepara = sh => {
    let el = sh.lastElementChild;
    while(el && !el.matches('button') && el.lastElementChild) el = el.lastElementChild;
    const ch = el && el.matches('button') && /^\s*Chiudi\s*$/i.test(el.textContent) ? el : null;
    const altri = [...sh.querySelectorAll('button, .btn, select, input:not([type=hidden]), textarea')].some(b => b !== ch && !b.closest('.sheet-x'));
    const fisso = !!ch && !altri;
    if(ch) ch.classList.toggle('x-fisso', fisso);
    let xr = sh.querySelector(':scope > .sheet-x');
    if(fisso){ if(xr) xr.remove(); return; }
    if(!xr){
      xr = document.createElement('div'); xr.className = 'sheet-x';
      xr.innerHTML = '<button type="button" aria-label="Chiudi" title="Chiudi (Esc)">' + X + '</button>';
      xr.firstChild.onclick = e => { e.preventDefault(); e.stopPropagation(); chiudi(sh.closest('.sheet-bg')); };
      sh.insertBefore(xr, sh.firstChild);
    }
    allinea(sh, xr);
  };
  let att = false;
  const scan = () => { att = false; document.querySelectorAll('.sheet').forEach(prepara); };
  new MutationObserver(() => { if(!att){ att = true; queueMicrotask(scan); } }).observe(document.body, {childList: true, subtree: true});
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    const v = document.querySelector('.viewer [data-vx]'); if(v){ v.click(); return; }
    const l = document.querySelectorAll('.sheet-bg'); if(l.length) chiudi(l[l.length - 1]);
  });
})();
</script>
