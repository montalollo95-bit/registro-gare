<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Designazioni">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E6A47">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Le mie designazioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<script src="firebase-config.js"></script>
<style>
/* Layout: app a una colonna — fascia verde campo in testa, schede sotto, tab bar fissa in basso */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#E6EBE3; --line:#D3D9CE;
  --fg:#15211B; --muted:#5B6A61; --pitch:#1E6A47; --pitch-deep:#164F35; --pitch-ink:#FFFFFF;
  --card-yellow:#F0B400; --yellow-ink:#1A1400; --card-red:#D23A2E; --ok:#1E6A47; --warn:#B7791F;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1310; --surface:#151F1A; --surface-2:#1D2924; --line:#2A3832;
  --fg:#E7EEE9; --muted:#93A399; --pitch:#2F8A5E; --pitch-deep:#1C5E3F; --pitch-ink:#FFFFFF;
  --card-yellow:#F5C02E; --yellow-ink:#1A1400; --card-red:#EF5A4C; --ok:#4CB884; --warn:#E0A84A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#151F1A; --surface-2:#1D2924; --line:#2A3832;
  --fg:#E7EEE9; --muted:#93A399; --pitch:#2F8A5E; --pitch-deep:#1C5E3F; --pitch-ink:#FFFFFF;
  --card-yellow:#F5C02E; --yellow-ink:#1A1400; --card-red:#EF5A4C; --ok:#4CB884; --warn:#E0A84A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pitch-deep)}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--card-yellow);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:16px}

/* fascia di testa: arriva ai bordi dello schermo */
.band{background:linear-gradient(160deg,var(--pitch) 0%,var(--pitch-deep) 100%);color:var(--pitch-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-radius:0 0 24px 24px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.12);pointer-events:none}
.band::before{content:"";position:absolute;right:48px;top:50px;width:2px;height:200px;background:rgba(255,255,255,.1);pointer-events:none}
.band-in{max-width:640px;margin:0 auto;padding-block:20px 22px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.band h1{font-size:40px;font-weight:800;text-transform:uppercase;line-height:1}
.band .date{opacity:.85;font-weight:500;font-size:17px}
.band.sub .band-in{flex-direction:row;align-items:center;gap:10px;padding-block:14px}
.band.sub h1{font-size:24px;flex:1;text-align:center}
.back{display:inline-flex;align-items:center;gap:4px;padding:8px 14px 8px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:inherit;text-decoration:none;font-weight:600;cursor:pointer}
.round{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:inherit;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center}
.spacer{width:44px}
.page{padding-top:16px}

/* card prossima designazione */
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.next h2{font-size:28px;line-height:1.05;text-transform:uppercase}
.next .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-weight:600}
.next .when{color:var(--pitch);font-weight:700}

.addr{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--fg);text-decoration:none}
.addr .pin{width:40px;height:40px;border-radius:12px;background:var(--pitch);color:var(--pitch-ink);display:grid;place-items:center}
.addr-t{min-width:0;display:flex;flex-direction:column;gap:1px;overflow-wrap:anywhere}
.addr-t span{color:var(--muted);font-size:15px}
.addr-t small{color:var(--ok);font-weight:700;font-size:13px;margin-top:2px}

.next-date{color:var(--card-red);text-transform:uppercase;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1.1;text-wrap:balance}

/* scorciatoie */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-head h2{font-size:24px}
.sec-head a{color:var(--pitch);font-weight:700;text-decoration:none}
.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sc{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--fg);font-weight:600;font-size:13px;text-align:center;min-width:0}
.sc .ic{width:100%;max-width:92px;aspect-ratio:1;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--pitch)}
.sc .ic svg{width:34px;height:34px}
.sc:active .ic{transform:scale(.96)}

/* statistiche */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stat{padding:16px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--display);font-size:34px;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.chip-y,.chip-r{display:inline-block;width:9px;height:13px;border-radius:2px;vertical-align:-2px}
.chip-y{background:var(--card-yellow)} .chip-r{background:var(--card-red)}

/* controlli */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;text-decoration:none;min-height:48px}
.btn-yellow{background:var(--card-yellow);color:var(--yellow-ink)}
.btn-primary{background:var(--pitch);color:var(--pitch-ink)}
.btn-ghost{background:var(--surface-2);color:var(--fg)}
.btn-danger{background:transparent;color:var(--card-red);border:1px solid var(--card-red)}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

/* liste */
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.gara{display:grid;grid-template-columns:58px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.gara .day{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);border-radius:10px;padding:6px 0}
.gara .day b{font-family:var(--display);font-size:26px;line-height:1}
.gara .day span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.gara .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.gara .teams{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.gara .sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.ruolo{background:color-mix(in srgb,var(--pitch) 18%,transparent);color:var(--ok)}
.pill.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.rinv{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.empty-box{border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-box .eic{width:64px;height:64px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;color:var(--pitch)}
.empty-box .eic svg{width:32px;height:32px}
.empty-box h3{color:var(--fg);font-size:24px}

/* calendario */
.cal-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{font-size:26px;text-transform:capitalize}
.nav2{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface-2);cursor:pointer;font-size:22px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dow{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:6px}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:12px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:20px;font-weight:600;padding:0}
.cal button.out{visibility:hidden}
.cal button.today{box-shadow:inset 0 0 0 2px var(--pitch)}
.cal button.sel{background:var(--pitch);color:var(--pitch-ink)}
.cal .dots{display:flex;gap:3px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--card-yellow)}
.month-sep{font-family:var(--display);font-size:20px;text-transform:capitalize;padding-top:6px}

/* importa */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.hero h2{font-size:28px;line-height:1.05}
.hero p{margin:0;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick label{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;min-height:150px}
.pick label:first-child{border-color:var(--pitch);box-shadow:inset 0 0 0 1px var(--pitch)}
.pick .pic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--pitch)}
.pick label:first-child .pic{background:var(--pitch);color:var(--pitch-ink)}
.pick .pic svg{width:26px;height:26px}
.pick b{font-family:var(--display);font-size:22px;line-height:1.05}
.pick span{font-size:14px;color:var(--muted)}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.steps h2{font-size:24px}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px}
.steps li > i{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:18px;color:var(--pitch)}
.steps li b{display:block}
.steps li span{color:var(--muted);font-size:15px}
.preview{display:flex;gap:8px;overflow-x:auto}
.preview img{height:96px;border-radius:10px;border:1px solid var(--line)}
.status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-weight:600}
.status.err{background:color-mix(in srgb,var(--card-red) 14%,transparent);color:var(--card-red)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--pitch);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}

/* spese */
.money{background:linear-gradient(160deg,var(--pitch) 0%,var(--pitch-deep) 100%);color:var(--pitch-ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.money .eyebrow{color:inherit;opacity:.8}
.money .tot{font-family:var(--display);font-size:52px;font-weight:800;line-height:1}
.money .split{display:flex;gap:22px;flex-wrap:wrap}
.money .split b{display:block;font-size:18px}
.money .split span{opacity:.8;font-size:14px}
.mov{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.mov .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--display);font-weight:800;color:var(--pitch)}
.mov .mt{min-width:0}
.mov .mt b{display:block;overflow-wrap:anywhere}
.mov .mt span{font-size:14px;color:var(--muted)}
.mov .amt{font-family:var(--display);font-size:22px;font-weight:700}

/* moduli */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.form h3{grid-column:1/-1;font-size:22px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.field textarea{min-height:64px;resize:vertical}
.form .sep{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.form .actions{grid-column:1/-1}

/* referto */
.ref-head h2{font-size:30px;text-transform:uppercase;line-height:1.05}
.ref-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ref-sec > header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ref-sec h3{font-size:22px;display:flex;align-items:center;gap:6px}
.cnt{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--surface-2);font-family:var(--body);font-size:13px}
.btn.sm{min-height:38px;padding:8px 12px;font-size:15px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.score label{display:block;font-weight:700;font-size:14px;text-align:center;overflow-wrap:anywhere;margin-bottom:4px}
.score input{width:100%;font-family:var(--display);font-size:44px;font-weight:800;text-align:center;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.score .dash{font-family:var(--display);font-size:36px;padding-bottom:12px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.ev{display:grid;grid-template-columns:62px 1fr 62px 40px;gap:6px;padding:10px;border-radius:12px;background:var(--surface-2)}
.ev input,.ev select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0;width:100%}
.ev .wide{grid-column:1/-1}
.ev.dir{grid-template-columns:62px 1fr 40px}
.ev .x{border:0;border-radius:10px;background:transparent;color:var(--card-red);font-size:18px;cursor:pointer}
.copybox{width:100%;min-height:200px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--mono);font-size:13px}

.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-row{cursor:pointer;border-radius:12px;padding:8px}
.cat-row.sel,.cat-sub .sel{background:color-mix(in srgb,var(--pitch) 14%,transparent)}
.cat-sub [data-cat]{cursor:pointer;border-radius:8px;padding:4px 6px}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.cat-row > div:first-child{min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.cat-row span{font-size:13px;color:var(--muted)}
.cat-eur{font-family:var(--display);font-size:22px;font-weight:700}
.cat-bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--pitch)}
.cat-sub{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;padding:8px 0 0 12px;border-left:2px solid var(--line);margin-top:4px}
.cat-sub div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px}
.cat-sub span{min-width:0}
.cat-sub span{font-size:15px}
.cat-tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:10px;font-weight:700}

/* scheda */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{font-size:30px;text-transform:uppercase;line-height:1.05}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kv dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;border:1px solid var(--card-red)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ok);background:color-mix(in srgb,var(--pitch) 16%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px)}
.fed-row{cursor:default}
.band{padding-top:env(safe-area-inset-top,0px)}
.round[hidden]{display:grid!important;visibility:hidden}
.tabs nav{grid-template-columns:repeat(5,1fr)!important}
.linkbtn{border:0;background:none;color:var(--ok);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px;font:inherit}
.err-t{color:var(--card-red);font-weight:600}
.ds-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ds-chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:2px 8px 2px 6px;border-radius:99px;background:var(--surface-2);color:var(--fg);max-width:100%;overflow-wrap:anywhere}
.ds-chip i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.ds-chip.done i{background:var(--ok)} .ds-chip.no i{background:var(--card-red)} .ds-chip.wait i{background:var(--card-yellow)}
.ds-chip.no{color:var(--card-red)}
.ds-sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ds-sum div{padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.ds-sum div + div{border-left:1px solid var(--line)}
.ds-sum b{font-family:var(--display);font-size:30px;line-height:1}
.ds-sum span{font-size:12px;color:var(--muted)}
.ds-sum .bad b{color:var(--card-red)}
.ds-arb,.ds-off{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;flex-wrap:wrap}
.ds-arb > div,.ds-off > div{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 180px;align-items:flex-start}
.ds-arb span,.ds-off > div > span:not(.ds-chip){font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.ds-offrow{display:grid;grid-template-columns:1fr 132px 40px;gap:6px;margin-bottom:6px}
.ds-offrow select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0;width:100%}
.ds-offrow .x{border:0;border-radius:10px;background:transparent;color:var(--card-red);font-size:18px;cursor:pointer}
</style>
<style>
body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.linkbtn{border:0;background:none;color:var(--ok);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px;font:inherit}
.err-t{color:var(--card-red);font-weight:600}
.dz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.dz.new{border-color:var(--card-yellow);box-shadow:inset 0 0 0 1px var(--card-yellow)}
.dz.no{opacity:.75}
.dz-date{font-family:var(--display);font-size:22px;font-weight:700;color:var(--card-red);text-transform:uppercase;line-height:1.1}
.dz h2{font-size:24px;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.dz .kv{padding:10px 12px}
.dz-st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:4px 10px;border-radius:99px;align-self:flex-start}
.dz-st.wait{background:color-mix(in srgb,var(--card-yellow) 25%,transparent);color:var(--yellow-ink)}
.dz-st.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.dz-st.no{background:color-mix(in srgb,var(--card-red) 14%,transparent);color:var(--card-red)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media (prefers-color-scheme: dark){ .dz-st.wait{color:var(--card-yellow)} }
</style>
</head><body>
<div class="band"><div class="band-in">
  <div class="eyebrow" style="color:inherit;opacity:.75">Designazioni</div>
  <h1>Le mie gare</h1>
  <div class="date" id="who"></div>
</div></div>
<main class="wrap view" id="app"><div class="status"><span class="spin"></span>Apro…</div></main>
<div id="toastRoot" aria-live="polite"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date());
const parseD = s => { const [y, m, d] = (s || '').split('-').map(Number); return y ? new Date(y, m - 1, d) : null; };
const fmtLong = s => { const d = parseD(s); return d ? d.toLocaleDateString('it-IT', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}) : 'Data da definire'; };
const eur = n => (Number(n) || 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toastRoot').replaceChildren(t); setTimeout(() => t.remove(), 2600); }
const fbErr = e => {
  const c = e && e.code || '';
  return /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c) ? 'Email o password sbagliate.'
    : /email-already-in-use/.test(c) ? 'Esiste già un account con questa email: entra con “Accedi”.'
    : /weak-password/.test(c) ? 'La password deve avere almeno 6 caratteri.'
    : /invalid-email/.test(c) ? 'Email non valida.'
    : /too-many-requests/.test(c) ? 'Troppi tentativi: riprova tra qualche minuto.'
    : /network/.test(c) ? 'Nessuna connessione.'
    : 'Operazione non riuscita. Riprova.';
};

if(!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey)){ $('#app').innerHTML = '<div class="status err">Pagina non ancora configurata dal designatore.</div>'; return; }
const FBV = '10.12.2', base = `https://www.gstatic.com/firebasejs/${FBV}/`;
const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
let me = null, profilo = null, gare = [], loaded = false, mode = 'login', showPast = false, unsub = [];

load(base + 'firebase-app-compat.js').then(() => Promise.all([load(base + 'firebase-auth-compat.js'), load(base + 'firebase-firestore-compat.js')])).then(() => {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  if(window.FB_EMU){ firebase.auth().useEmulator(window.FB_EMU.auth, {disableWarnings: true}); firebase.firestore().useEmulator(window.FB_EMU.host, window.FB_EMU.port); }
  firebase.auth().onAuthStateChanged(async u => {
    unsub.forEach(f => f()); unsub = []; me = u; gare = []; loaded = false; profilo = null;
    if(!u){ $('#who').textContent = ''; render(); return; }
    const db = firebase.firestore();
    try{ const p = await db.collection('arbitri').doc(u.uid).get(); profilo = p.exists ? p.data() : null; }catch(e){}
    if(!profilo && pendingProfile){ try{ await db.collection('arbitri').doc(u.uid).set(pendingProfile); profilo = pendingProfile; }catch(e){} }
    $('#who').textContent = profilo ? [profilo.nome, profilo.cognome].filter(Boolean).join(' ') : u.email;
    unsub.push(db.collection('designazioni').where('arbitriIds', 'array-contains', u.uid).onSnapshot(s => { gare = s.docs.map(d => ({id: d.id, ...d.data()})); loaded = true; render(); },
      () => { loaded = true; gare = null; render(); }));
    render();
  });
}).catch(() => { $('#app').innerHTML = '<div class="status err">Serve internet per vedere le designazioni. Riprova.</div>'; });
let pendingProfile = null;

function render(){
  const app = $('#app');
  if(!me){ app.innerHTML = authHTML(); bindAuth(); return; }
  if(!profilo){ app.innerHTML = profileHTML(); bindProfile(); return; }
  if(!loaded){ app.innerHTML = '<div class="status"><span class="spin"></span>Carico le tue designazioni…</div>'; return; }
  if(gare === null){ app.innerHTML = '<div class="status err">Non riesco a leggere le designazioni. Riprova più tardi.</div>' + footer(); bindFooter(); return; }
  const t = todayIso(), key = d => `${d.data || '9999'} ${d.ora || ''}`;
  const up = gare.filter(d => !d.data || d.data >= t).sort((a, b) => key(a).localeCompare(key(b)));
  const past = gare.filter(d => d.data && d.data < t).sort((a, b) => key(b).localeCompare(key(a)));
  const da = up.filter(d => !risp(d)).length;
  app.innerHTML = `${da ? `<div class="status">Hai ${da === 1 ? '1 designazione' : da + ' designazioni'} da confermare.</div>` : ''}
    ${up.length ? up.map(card).join('') : '<div class="empty-box"><h3>Nessuna designazione</h3><span>Quando il designatore ti assegna una gara la trovi qui.</span></div>'}
    ${past.length ? `<button class="btn btn-ghost btn-block" id="past">${showPast ? 'Nascondi' : 'Mostra'} gare passate (${past.length})</button>${showPast ? past.map(d => card(d, true)).join('') : ''}` : ''}
    ${footer()}`;
  bindFooter();
  if($('#past')) $('#past').onclick = () => { showPast = !showPast; render(); };
  app.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => rispondi(b.dataset.acc, 'accettata'));
  app.querySelectorAll('[data-rif]').forEach(b => b.onclick = () => {
    const box = app.querySelector(`[data-rbox="${b.dataset.rif}"]`);
    box.innerHTML = `<div class="field"><label for="m-${esc(b.dataset.rif)}">Motivo (facoltativo)</label><input id="m-${esc(b.dataset.rif)}" placeholder="Es. impegno di lavoro"></div><div class="row"><button class="btn btn-danger" data-ok>Conferma rifiuto</button><button class="btn btn-ghost" data-no>Annulla</button></div>`;
    box.querySelector('[data-no]').onclick = () => box.innerHTML = '';
    box.querySelector('[data-ok]').onclick = () => rispondi(b.dataset.rif, 'rifiutata', box.querySelector('input').value.trim());
  });
  app.querySelectorAll('[data-ics]').forEach(b => b.onclick = () => ics(gare.find(d => d.id === b.dataset.ics)));
}
const risp = d => (d.risposte && d.risposte[me.uid]) || null;
function card(d, past){
  const r = risp(d), mine = (d.ufficiali || []).find(u => u.uid === me.uid) || {}, altri = (d.ufficiali || []).filter(u => u.uid !== me.uid);
  const dt = fmtLong(d.data), addr = [d.impianto, d.indirizzo, d.citta].filter(Boolean).join(', ');
  const maps = /^https:\/\//.test(d.mapsUrl || '') ? d.mapsUrl : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr);
  const st = r ? (r.stato === 'accettata' ? '<span class="dz-st done">✓ Accettata</span>' : '<span class="dz-st no">✕ Rifiutata</span>') : '<span class="dz-st wait">● Da confermare</span>';
  const kv = [['Ruolo', mine.ruolo || 'Arbitro'], ['Campionato', [d.categoria, d.girone && 'girone ' + d.girone, d.numeroGara && 'gara n. ' + d.numeroGara].filter(Boolean).join(' · ')], ['Campo', addr], ['Con', altri.map(u => `${u.nome} (${u.ruolo})`).join(', ')], ['Rimborso', d.rimborso ? eur(d.rimborso) : ''], ['Note', d.note]].filter(x => x[1]);
  return `<article class="dz${!r && !past ? ' new' : ''}${r && r.stato === 'rifiutata' ? ' no' : ''}">
    <div class="who">${st}</div>
    <div class="dz-date">${esc(dt)}${d.ora ? ' · ore ' + esc(d.ora) : ''}</div>
    <h2>${esc(d.casa || '—')} – ${esc(d.ospite || '—')}</h2>
    <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${past ? '' : `<div class="row">${!r || r.stato !== 'accettata' ? `<button class="btn btn-primary" data-acc="${esc(d.id)}">Accetto</button>` : ''}${!r || r.stato !== 'rifiutata' ? `<button class="btn btn-danger" data-rif="${esc(d.id)}">Rifiuto</button>` : ''}</div><div data-rbox="${esc(d.id)}"></div>
    <div class="row">${addr ? `<a class="btn btn-ghost" href="${esc(maps)}" target="_blank" rel="noopener">Google Maps</a>` : ''}${d.data ? `<button class="btn btn-ghost" data-ics="${esc(d.id)}">Aggiungi al Calendario</button>` : ''}</div>`}
  </article>`;
}
async function rispondi(id, stato, motivo){
  try{ await firebase.firestore().collection('designazioni').doc(id).update({[`risposte.${me.uid}`]: {stato, motivo: motivo || '', at: Date.now()}}); toast(stato === 'accettata' ? 'Gara accettata' : 'Gara rifiutata'); }
  catch(e){ toast('Non sono riuscito a salvare la risposta. Riprova.'); }
}
function ics(d){
  if(!d || !d.data) return;
  const [h, m] = (d.ora || '15:00').split(':').map(Number), st = parseD(d.data); st.setHours(h || 0, m || 0);
  const en = new Date(st.getTime() + 2 * 3600000), dtz = x => x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const e = s => String(s || '').replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
  const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Designazioni//IT', 'BEGIN:VEVENT', `UID:${d.id}@designazioni`, `DTSTAMP:${dtz(new Date())}`, `DTSTART:${dtz(st)}`, `DTEND:${dtz(en)}`,
    `SUMMARY:${e(`${d.casa} – ${d.ospite}`)}`, `LOCATION:${e([d.impianto, d.indirizzo, d.citta].filter(Boolean).join(', '))}`, `DESCRIPTION:${e([d.categoria, d.numeroGara && 'Gara n. ' + d.numeroGara, d.note].filter(Boolean).join('\n'))}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Gara domani', 'TRIGGER:-P1D', 'END:VALARM', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Gara', 'TRIGGER:-PT3H', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const url = URL.createObjectURL(new Blob([txt], {type: 'text/calendar'})), a = document.createElement('a');
  a.href = url; a.download = `gara-${d.data}.ics`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const footer = () => `<p class="note" style="text-align:center;margin:8px 0 0">${esc(me.email)} · <button class="linkbtn" id="out">Esci</button></p>`;
const bindFooter = () => { const o = $('#out'); if(o) o.onclick = () => firebase.auth().signOut(); };

function authHTML(){
  const reg = mode === 'reg';
  return `<div class="seg" role="group" aria-label="Accesso"><button data-m="login" aria-pressed="${!reg}">Accedi</button><button data-m="reg" aria-pressed="${reg}">Registrati</button></div>
  <form class="form" id="auth" autocomplete="on">
    <h3>${reg ? 'Crea il tuo account' : 'Accedi'}</h3>
    ${reg ? `<div class="field"><label for="a-nome">Nome</label><input id="a-nome" autocomplete="given-name" required></div><div class="field"><label for="a-cog">Cognome</label><input id="a-cog" autocomplete="family-name" required></div>
    <div class="field full"><label for="a-tel">Cellulare</label><input id="a-tel" type="tel" autocomplete="tel" placeholder="Per ricevere le designazioni su WhatsApp"></div>` : ''}
    <div class="field full"><label for="a-em">Email</label><input id="a-em" type="email" autocomplete="username" required></div>
    <div class="field full"><label for="a-pw">Password</label><input id="a-pw" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" minlength="6" required></div>
    <div class="field full" id="a-msg" aria-live="polite"></div>
    <div class="actions"><button class="btn btn-primary btn-block" type="submit">${reg ? 'Registrati' : 'Entra'}</button></div>
    ${reg ? '' : '<button class="linkbtn" type="button" id="a-reset" style="grid-column:1/-1">Password dimenticata?</button>'}
  </form>
  <p class="note" style="margin:0;text-align:center">Qui vedi solo le gare a cui ti ha designato il designatore. Non puoi modificarle: puoi solo accettarle o rifiutarle.</p>`;
}
function bindAuth(){
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
  const f = $('#auth'), msg = $('#a-msg'), v = id => (f.querySelector('#' + id) || {value: ''}).value.trim();
  f.onsubmit = async e => {
    e.preventDefault(); msg.innerHTML = '<span class="spin" style="display:inline-block"></span>';
    try{
      if(mode === 'reg'){
        pendingProfile = {nome: v('a-nome'), cognome: v('a-cog'), telefono: v('a-tel'), email: v('a-em').toLowerCase(), createdAt: Date.now()};
        await firebase.auth().createUserWithEmailAndPassword(v('a-em'), f.querySelector('#a-pw').value);
      } else await firebase.auth().signInWithEmailAndPassword(v('a-em'), f.querySelector('#a-pw').value);
    }catch(err){ pendingProfile = null; msg.innerHTML = `<span class="err-t">${esc(fbErr(err))}</span>`; }
  };
  if($('#a-reset')) $('#a-reset').onclick = async () => {
    if(!v('a-em')){ msg.textContent = 'Scrivi prima la tua email.'; return; }
    try{ await firebase.auth().sendPasswordResetEmail(v('a-em')); msg.textContent = 'Ti ho mandato un’email per cambiare la password.'; }catch(err){ msg.innerHTML = `<span class="err-t">${esc(fbErr(err))}</span>`; }
  };
}
function profileHTML(){
  return `<form class="form" id="prof"><h3>Completa il profilo</h3><p class="note" style="grid-column:1/-1;margin:0">Il designatore ti trova con questi dati.</p>
    <div class="field"><label for="p-nome">Nome</label><input id="p-nome" required></div><div class="field"><label for="p-cog">Cognome</label><input id="p-cog" required></div>
    <div class="field full"><label for="p-tel">Cellulare</label><input id="p-tel" type="tel"></div>
    <div class="field full" id="p-msg"></div><div class="actions"><button class="btn btn-primary btn-block">Salva</button></div></form>${footer()}`;
}
function bindProfile(){
  bindFooter();
  const f = $('#prof'), v = id => f.querySelector('#' + id).value.trim();
  f.onsubmit = async e => { e.preventDefault();
    const p = {nome: v('p-nome'), cognome: v('p-cog'), telefono: v('p-tel'), email: (me.email || '').toLowerCase(), createdAt: Date.now()};
    try{ await firebase.firestore().collection('arbitri').doc(me.uid).set(p); profilo = p; $('#who').textContent = p.nome + ' ' + p.cognome; render(); }catch(err){ $('#p-msg').innerHTML = '<span class="err-t">Non riesco a salvare. Riprova.</span>'; } };
}
})();
</script>
</body></html>
